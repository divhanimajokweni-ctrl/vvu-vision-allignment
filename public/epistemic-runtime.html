<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EPISTEMIC RUNTIME · Serverless Command Center</title>
<style>
:root{
  --bg:#0a0e13;--bg2:#0e141c;--panel:#111a24;--panel2:#0d151e;
  --line:#1c2836;--line2:#26374a;
  --txt:#dce8f2;--dim:#75899c;--dim2:#4e6172;
  --acc:#37d6a0;--acc2:#3aa9f5;--warn:#f5b944;--bad:#f2607a;--pur:#a78bfa;--quar:#e8907a;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--mono);font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden}
#app{display:grid;grid-template-columns:220px 1fr;height:100vh}

/* ── nav ── */
#nav{background:linear-gradient(180deg,#0d141d,#0a0f15);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
#brand{padding:14px 14px 12px;border-bottom:1px solid var(--line)}
#brand b{font-size:13px;letter-spacing:.14em;color:var(--txt)}
#brand span{display:block;font-size:9.5px;color:var(--dim2);letter-spacing:.12em;margin-top:3px}
#navlist{flex:1;overflow-y:auto;padding:6px 0}
.ngroup{font-size:9px;letter-spacing:.18em;color:var(--dim2);padding:12px 14px 5px;text-transform:uppercase}
.nitem{display:flex;align-items:center;gap:9px;padding:6px 14px;cursor:pointer;color:var(--dim);border-left:2px solid transparent;font-size:12px;user-select:none}
.nitem:hover{background:#121c27;color:var(--txt)}
.nitem.on{background:linear-gradient(90deg,rgba(55,214,160,.13),transparent);color:var(--txt);border-left-color:var(--acc)}
.nitem .ic{width:15px;text-align:center;color:var(--acc2);font-size:12px}
.nitem.on .ic{color:var(--acc)}
.nitem .ct{margin-left:auto;font-size:10px;color:var(--dim2);background:#16212d;border:1px solid var(--line);border-radius:20px;padding:0 6px;line-height:15px}
#navfoot{padding:9px 12px;border-top:1px solid var(--line);font-size:9.5px;color:var(--dim2);line-height:1.7}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin-right:5px;box-shadow:0 0 7px var(--acc);animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.35}}

/* ── topbar ── */
#main{display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap}
#topbar h1{font-size:13px;margin:0;font-weight:600;letter-spacing:.04em;white-space:nowrap}
#topbar .sub{font-size:10px;color:var(--dim2);letter-spacing:.1em}
.spacer{flex:1}
.gsearch{background:#0b1219;border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:6px 10px;font:inherit;font-size:11.5px;width:200px;outline:none}
.gsearch:focus{border-color:var(--acc2)}
.btn{background:#16222e;border:1px solid var(--line);color:var(--dim);border-radius:7px;padding:6px 10px;font:inherit;font-size:11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--acc2);color:var(--acc2)}
.btn:disabled{opacity:.35;cursor:default}
.btn.p{background:rgba(55,214,160,.1);border-color:rgba(55,214,160,.4);color:var(--acc)}
.btn.sm{padding:3px 7px;font-size:10px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}

/* ── view ── */
#view{flex:1;overflow-y:auto;padding:16px}
.panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:11px;margin-bottom:14px;overflow:hidden}
.ph{display:flex;align-items:center;gap:9px;padding:10px 13px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--acc2);font-weight:600}
.ph .hint{font-size:10px;color:var(--dim2)}
.pb{padding:13px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
@media(max-width:1080px){.g2,.g3,.g21,.g12{grid-template-columns:1fr}}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.kpi .l{font-size:9.5px;letter-spacing:.14em;color:var(--dim2);text-transform:uppercase}
.kpi .v{font-size:22px;margin-top:5px;color:var(--txt);line-height:1}
.kpi .d{font-size:10px;color:var(--dim);margin-top:4px}
.kpi.a .v{color:var(--acc)}.kpi.b .v{color:var(--acc2)}.kpi.w .v{color:var(--warn)}.kpi.r .v{color:var(--bad)}.kpi.q .v{color:var(--quar)}

/* badges */
.b{font-size:9.5px;padding:2px 7px;border-radius:20px;font-weight:600;letter-spacing:.06em;border:1px solid}
.b.ok{color:var(--acc);background:rgba(55,214,160,.1);border-color:rgba(55,214,160,.3)}
.b.warn{color:var(--warn);background:rgba(245,185,68,.1);border-color:rgba(245,185,68,.3)}
.b.bad{color:var(--bad);background:rgba(242,96,122,.1);border-color:rgba(242,96,122,.3)}
.b.mut{color:var(--dim);background:#16212d;border-color:var(--line)}
.b.info{color:var(--acc2);background:rgba(58,169,245,.1);border-color:rgba(58,169,245,.3)}
.b.pur{color:var(--pur);background:rgba(167,139,250,.1);border-color:rgba(167,139,250,.3)}

/* table */
.tbar{display:flex;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tbar input{background:#0b1219;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:5px 9px;font:inherit;font-size:11px;width:180px;outline:none}
.tbar input:focus{border-color:var(--acc2)}
.tbar .cnt{font-size:10px;color:var(--dim2)}
.tbar .acts{margin-left:auto;display:flex;gap:6px}
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:left;padding:7px 11px;color:var(--dim2);font-weight:600;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--panel2);z-index:1}
td{padding:7px 11px;border-bottom:1px solid #16202b;vertical-align:middle;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:#121c27}
.mono{font-family:var(--mono)}
.hint{font-size:10px;color:var(--dim2);line-height:1.6}

/* alerts */
.alist{padding:8px}
.arow{display:flex;align-items:center;gap:10px;padding:7px 6px;border-bottom:1px solid #16202b}
.arow:last-child{border-bottom:none}
.sv{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sv.ok{background:var(--acc);box-shadow:0 0 6px var(--acc)}.sv.warn{background:var(--warn);box-shadow:0 0 6px var(--warn)}
.sv.bad{background:var(--bad);box-shadow:0 0 6px var(--bad);animation:pulse 1.5s infinite}.sv.info{background:var(--acc2)}
.arow .tm{margin-left:auto;font-size:10px;color:var(--dim2);white-space:nowrap}

/* code */
.codeblock{font-family:var(--mono);font-size:12px;line-height:1.55;background:#080d12;border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;white-space:pre;color:var(--txt)}
textarea.code{font-family:var(--mono);font-size:12px;background:#080d12;border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:10px;width:100%;resize:vertical;outline:none;tab-size:2}
textarea.code:focus{border-color:var(--acc2)}

/* bar */
.bar{height:5px;border-radius:3px;background:#16222e;overflow:hidden;width:100%}
.bar i{display:block;height:100%;border-radius:3px}
.bar i.g{background:var(--acc)}.bar i.w{background:var(--warn)}.bar i.r{background:var(--bad)}

/* kv */
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12px}
.kv dt{color:var(--dim2)}.kv dd{color:var(--txt)}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;transition:border-color .2s}
.card:hover{border-color:var(--line2)}
.card .t{font-size:12.5px;font-weight:600;margin-bottom:5px}
.card .m{font-size:10.5px;color:var(--dim);line-height:1.5}

/* canvas chart */
canvas{display:block;width:100%}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tab{padding:7px 14px;cursor:pointer;font-size:11px;color:var(--dim);border-bottom:2px solid transparent}
.tab:hover{color:var(--txt)}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}

/* toast */
#toast{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:10px 14px;font-size:12px;box-shadow:0 4px 12px rgba(0,0,0,.4);animation:slideIn .3s}
.toast.ok{border-color:rgba(55,214,160,.4)}.toast.warn{border-color:rgba(245,185,68,.4)}.toast.bad{border-color:rgba(242,96,122,.4)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* status dots */
.sd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.sd.h{background:var(--acc);box-shadow:0 0 5px var(--acc)}
.sd.r{background:var(--warn);box-shadow:0 0 5px var(--warn);animation:pulse 2s infinite}
.sd.v{background:var(--bad);box-shadow:0 0 5px var(--bad);animation:pulse 1.5s infinite}

/* geo map */
svg{display:block}
.scroll-y{max-height:400px;overflow-y:auto}

/* pin chips */
.pinbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:20px;padding:3px 10px;font-size:11px;cursor:pointer;color:var(--dim)}
.pchip:hover{color:var(--txt)}
.pchip.on{border-color:rgba(55,214,160,.4);background:rgba(55,214,160,.08);color:var(--acc)}

/* form */
.frm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:10px;color:var(--dim2);letter-spacing:.08em;text-transform:uppercase}
.fld input,.fld select,.fld textarea{background:#0b1219;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:6px 9px;font:inherit;font-size:11px;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc2)}
</style>
</head>
<body>
<div id="app">
  <div id="nav">
    <div id="brand"><b>EPISTEMIC RUNTIME</b><span>SERVERLESS · OFFLINE</span></div>
    <div id="navlist"></div>
    <div id="navfoot">
      <span class="dot"></span><span id="footStatus">online · offline-capable</span><br>
      <span id="footCount">0 records</span><br>
      <span id="footHash" class="mono" style="font-size:8px;color:var(--dim2)"></span>
    </div>
  </div>
  <div id="main">
    <div id="topbar">
      <div><h1 id="vtitle">Overview</h1><span class="sub" id="vsub">· runtime health</span></div>
      <div class="spacer"></div>
      <input class="gsearch" id="gsearch" placeholder="search all records… (Enter)">
      <button class="btn sm" id="btnExport">export</button>
      <button class="btn sm" id="btnImport">import</button>
      <button class="btn sm danger" id="btnReset">reset</button>
      <input type="file" id="fileIn" style="display:none" accept=".json">
    </div>
    <div id="view"></div>
  </div>
</div>
<div id="toast"></div>

<script>
(function(){
"use strict";

/* ════════════════════════════════════════════════════════════════════════════
   1 · CORE INFRASTRUCTURE (real, not simulated)
   ════════════════════════════════════════════════════════════════════════════ */

/* ── SHA-256 (Web Crypto API) ── */
async function sha256(s){
  var buf=new TextEncoder().encode(s);
  var h=await crypto.subtle.digest('SHA-256',buf);
  return Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}
/* Sync hash fallback (FNV-1a) for non-crypto paths */
function fnv1a(s){var h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193);}return(h>>>0).toString(16).padStart(8,'0');}

/* ── Append-Only Audit Log ── */
var AuditLog={
  entries:[],
  listeners:[],
  append:function(action,coll,id,before,after,actor){
    var seq=this.entries.length;
    var prev=seq>0?this.entries[seq-1].hash:fnv1a('genesis');
    var ts=Date.now();
    var hash=fnv1a(prev+action+coll+id+JSON.stringify(after)+ts);
    var e={seq:seq,ts:ts,action:action,collection:coll,recordId:id,before:before,after:after,actor:actor||'system',prev:prev,hash:hash};
    this.entries.push(e);
    this.listeners.forEach(function(f){f(e);});
    return e;
  },
  verify:function(){for(var i=1;i<this.entries.length;i++){if(this.entries[i].prev!==this.entries[i-1].hash)return{valid:false,brokenAt:i};}return{valid:true,brokenAt:null};},
  replay:function(){var s={};this.entries.forEach(function(e){if(!s[e.collection])s[e.collection]={};if(e.action.endsWith('.delete')||e.action.endsWith('.remove'))delete s[e.collection][e.recordId];else if(e.after)s[e.collection][e.recordId]=e.after;});return s;},
  head:function(){return this.entries.length?this.entries[this.entries.length-1].hash:fnv1a('genesis');},
  onAppend:function(f){this.listeners.push(f);},
  export:function(){return{exported:new Date().toISOString(),head:this.head(),entries:this.entries};},
  import:function(s){this.entries=s.entries||[];},
  reset:function(){this.entries=[];}
};

/* ── Plugin Hooks ── */
var Hooks={
  plugins:[],
  register:function(p){this.plugins.push(Object.assign({state:'enabled'},p));},
  fire:function(hook,payload){this.plugins.filter(function(p){return p.hook===hook&&p.state==='enabled';}).forEach(function(p){try{p.callback(payload);}catch(e){console.error('[plugin:'+p.id+']',e);}});},
  getAll:function(){return this.plugins;},
  toggle:function(id){var p=this.plugins.find(function(x){return x.id===id;});if(p)p.state=p.state==='enabled'?'disabled':'enabled';}
};

/* ── Store (localStorage-persisted, Canonical pattern) ── */
var Store={
  d:{policies:[],shards:[],merges:[],proofs:[],violations:[],shadowEvents:[],mined:[],revisions:[],evidence:[],audit:[]},
  K:'epistemic:store',
  load:function(){try{var s=localStorage.getItem(this.K);if(s){var p=JSON.parse(s);if(p&&p.policies&&p.policies.length>0)this.d=p;}}catch(e){console.warn('store load failed',e);}},
  save:function(){try{localStorage.setItem(this.K,JSON.stringify(this.d));}catch(e){console.warn('store save failed',e);}},
  all:function(k){return this.d[k]||[];},
  upsert:function(k,r,idKey){idKey=idKey||'id';var a=this.d[k]||(this.d[k]=[]);var i=a.findIndex(function(x){return x[idKey]===r[idKey];});if(i>=0)a[i]=r;else a.push(r);this.save();},
  remove:function(k,idKey,id){var a=this.d[k]||(this.d[k]=[]);this.d[k]=a.filter(function(x){return x[idKey]!==id;});this.save();},
  commit:function(action,detail){AuditLog.append(action,detail,'',{},{detail:detail},'ui');Hooks.fire('store.commit',{action:action,detail:detail});this.save();},
  counts:function(){var c={};for(var k in this.d)c[k]=this.d[k].length;return c;}
};

/* ── Event Bus (in-process pub/sub) ── */
var Bus={
  handlers:{},
  on:function(ev,fn){if(!this.handlers[ev])this.handlers[ev]=[];this.handlers[ev].push(fn);},
  emit:function(ev,data){(this.handlers[ev]||[]).forEach(function(f){f(data);});},
  clear:function(){this.handlers={};}
};

/* ── Helpers ── */
var $=function(s,p){return(p||document).querySelector(s);};
var $$=function(s,p){return Array.from((p||document).querySelectorAll(s));};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(n){return n==null?'—':n.toLocaleString();}
function ago(ts){if(!ts)return'—';var s=Math.floor((Date.now()-ts)/1000);if(s<60)return s+'s ago';var m=Math.floor(s/60);if(m<60)return m+'m ago';var h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago';}
function fd(ts){if(!ts)return'—';return new Date(ts).toLocaleDateString();}
function hhmmss(ts){if(!ts)return'—';return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function toast(msg,type){var t=document.createElement('div');t.className='toast '+(type||'ok');t.textContent=msg;$('#toast').appendChild(t);setTimeout(function(){t.remove();},3000);}
function download(name,content,type){var b=new Blob([content],{type:type||'text/plain'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
function badge(v){var map={healthy:'ok',applied:'ok',verified:'ok',active:'ok',enabled:'ok',committed:'ok',pass:'ok',repairing:'warn',pending:'warn',elevated:'warn',high:'warn',violating:'bad',rejected:'bad',fault:'bad',critical:'bad',fail:'bad',error:'bad',sealed:'info',archive:'mut',intake:'warn',verify:'info',idle:'mut',disabled:'mut'};return'<span class="b '+(map[v]||'mut')+'">'+esc(v)+'</span>';}
function bar(v){var c=v>=90?'r':v>=70?'w':'g';return'<div class="bar"><i class="'+c+'" style="width:'+clamp(v,0,100)+'%"></i></div>';}

/* ════════════════════════════════════════════════════════════════════════════
   2 · SEED DATA
   ════════════════════════════════════════════════════════════════════════════ */

function seed(){
  var now=Date.now();
  var regions=['europe-west','europe-north','na-east','na-west','apac-south','apac-east','za-ec','za-wc','za-gp','za-lp'];
  var nodes=['edge-01','edge-02','edge-03','cloud-01','cloud-02'];
  var regionGeo={
    'europe-west':{lat:50.11,lng:8.68,label:'Western Europe'},
    'europe-north':{lat:59.33,lng:18.07,label:'Northern Europe'},
    'na-east':{lat:40.71,lng:-74.01,label:'NA East'},
    'na-west':{lat:37.77,lng:-122.42,label:'NA West'},
    'apac-south':{lat:1.35,lng:103.82,label:'APAC South'},
    'apac-east':{lat:35.68,lng:139.69,label:'APAC East'},
    'za-ec':{lat:-33.96,lng:25.60,label:'Eastern Cape'},
    'za-wc':{lat:-33.92,lng:18.42,label:'Western Cape'},
    'za-gp':{lat:-26.20,lng:28.05,label:'Gauteng'},
    'za-lp':{lat:-23.90,lng:29.45,label:'Limpopo'}
  };

  var policies=[
    {id:'p1',name:'grid_frequency_stability',filename:'grid-frequency.epd',domain:'smart_grid',version:'1.0.0',invariantCount:3,shardCount:6,zkEnabled:true,shadowEnabled:true,repairStrategy:'self_repair',proofKind:'mmr',takeoverLatencyMs:250,ok:true,wasmFingerprint:'1379f740',errorCount:0,warningCount:0,createdAt:now-86400000*7,source:'# Smart Grid — frequency & energy-balance invariants\npolicy "grid_frequency_stability" {\n  description "Maintain grid frequency and energy balance"\n  domain "smart_grid"\n  version "1.0.0"\n  shard by region { key "geo_region" strategy locality_preserving count 6 replication 3 }\n  invariant "freq_bounds" { predicate frequency in [49.8, 50.2] severity critical }\n  invariant "energy_conservation" { predicate sum(generation) >= sum(load) + losses severity critical }\n  soft invariant "thermal_headroom" { predicate thermal_headroom >= 10 severity medium }\n  on_violation { strategy self_repair objective least_divergent max_iters 500 }\n  ancestry { proof mmr zk true gossip p2p anchor rekor }\n  shadow_bridge { enabled true takeover_latency_ms 250 }\n  export to wasm\n  export to rust\n}'},
    {id:'p2',name:'hospital_census',filename:'hospital-census.epd',domain:'public_health',version:'0.9.0',invariantCount:3,shardCount:1,zkEnabled:true,shadowEnabled:false,repairStrategy:'self_repair',proofKind:'mmr',takeoverLatencyMs:0,ok:true,wasmFingerprint:'9d7545dc',errorCount:0,warningCount:0,createdAt:now-86400000*6},

function Chart(values,opts){
  opts=opts||{};
  var c=document.createElement('canvas');c.style.height=(opts.h||150)+'px';
  function draw(){
    var dpr=window.devicePixelRatio||1;
    c.width=c.clientWidth*dpr;c.height=(opts.h||150)*dpr;
    var x=c.getContext('2d'),W=c.width,H=c.height,pad=6*dpr;
    x.clearRect(0,0,W,H);
    x.strokeStyle='#1a2634';x.lineWidth=1;
    for(var g=0;g<=4;g++){var y=pad+(H-pad*2)*g/4;x.beginPath();x.moveTo(pad,y);x.lineTo(W-pad,y);x.stroke();}
    if(!values.length)return;
    var px=function(i){return pad+(W-pad*2)*i/Math.max(1,values.length-1);};
    var py=function(v){return H-pad-(H-pad*2)*clamp(v,0,1);};
    function trace(){x.beginPath();values.forEach(function(v,i){var X=px(i),Y=py(v);i?x.lineTo(X,Y):x.moveTo(X,Y);});}
    trace();x.lineTo(px(values.length-1),H-pad);x.lineTo(px(0),H-pad);x.closePath();
    var gr=x.createLinearGradient(0,0,0,H);
    gr.addColorStop(0,opts.fill||'rgba(58,169,245,.34)');gr.addColorStop(1,'rgba(58,169,245,0)');
    x.fillStyle=gr;x.fill();
    trace();x.strokeStyle=opts.stroke||'#3aa9f5';x.lineWidth=1.8*dpr;x.stroke();
    if(opts.threshold!=null){var ty=py(opts.threshold);x.setLineDash([4*dpr,4*dpr]);x.beginPath();x.moveTo(pad,ty);x.lineTo(W-pad,ty);x.strokeStyle='#f5b944';x.lineWidth=1*dpr;x.stroke();x.setLineDash([]);}
    x.fillStyle=opts.stroke||'#3aa9f5';x.beginPath();x.arc(px(values.length-1),py(values[values.length-1]),3.2*dpr,0,7);x.fill();
  }
  setTimeout(draw,0);window.addEventListener('resize',draw);
  return c;
}

function DataTable(rows,fields,opts){
  opts=opts||{};
  var wrap=document.createElement('div');wrap.className='panel';
  var tw=document.createElement('div');tw.className='twrap';
  var table=document.createElement('table');
  var thead=document.createElement('tr');
  fields.forEach(function(f){var th=document.createElement('th');th.textContent=f.l;thead.appendChild(th);});
  var theadEl=document.createElement('thead');theadEl.appendChild(thead);table.appendChild(theadEl);
  var tbody=document.createElement('tbody');table.appendChild(tbody);
  tw.appendChild(table);wrap.appendChild(tw);
  rows.slice(0,opts.per||15).forEach(function(r){
    var tr=document.createElement('tr');
    fields.forEach(function(f){
      var td=document.createElement('td');
      var v=r[f.k];
      if(f.badge)td.innerHTML=badge(v);
      else if(f.bar)td.innerHTML='<span>'+v+'</span>'+bar(v);
      else if(f.mono)td.innerHTML='<span class="mono">'+esc(v)+'</span>';
      else td.innerHTML=esc(v);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  return wrap;
}

  for(var i=0;i<7;i++){var lat=60-i*30;var y=proj(lat,0).y;svg+='<line x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'" stroke="#1a2634" stroke-width="0.3" stroke-dasharray="2 4"/>';}
  for(var i=0;i<11;i++){var lng=-180+i*36;var x=proj(0,lng).x;svg+='<line x1="'+x+'" y1="0" x2="'+x+'" y2="'+H+'" stroke="#1a2634" stroke-width="0.3" stroke-dasharray="2 4"/>';}
  // continents
  continents.forEach(function(outline){var pts=outline.map(function(p){var c=proj(p[0],p[1]);return c.x.toFixed(1)+','+c.y.toFixed(1);}).join(' ');svg+='<polygon points="'+pts+'" fill="#111a24" fill-opacity="0.6" stroke="#1c2836" stroke-width="0.5"/>';});
  // region markers
  var regionMap={};
  shards.forEach(function(s){regionMap[s.region]=regionMap[s.region]||[];regionMap[s.region].push(s);});
  Object.keys(regionMap).forEach(function(r){
    var s=regionMap[r][0];
    var p=proj(s.lat,s.lng);
    var hasV=regionMap[r].some(function(x){return x.invariantStatus==='violating';});
    var color=hasV?'#f2607a':'#37d6a0';
    svg+='<circle cx="'+p.x+'" cy="'+p.y+'" r="6" fill="'+color+'" fill-opacity="0.8" stroke="'+color+'" stroke-width="1.5"/>';

    svg+='<text x="'+p.x+'" y="'+(p.y+18)+'" text-anchor="middle" font-size="6" fill="#4e6172" font-family="monospace">'+regionMap[r].length+' shards</text>';
  });
  svg+='</svg>';
  var mapEl=document.createElement('div');mapEl.innerHTML=svg;
  view.appendChild(Panel('Geospatial topology','real lat/lng · spatial intelligence',mapEl));

  // Shard table
  view.appendChild(Panel('Shard ledger',shards.length+' shards',DataTable(shards,[
    {k:'region',l:'Region',mono:true},{k:'policyId',l:'Policy'},{k:'nodeId',l:'Node',mono:true},

  {id:'proofs',t:'MMR Proofs',g:'Crypto',i:'⛨',f:ModProofs},
  {id:'zkcircuit',t:'ZK Circuit',g:'Crypto',i:'⬡',f:ModZkCircuit},
  {id:'miner',t:'Invariant Miner',g:'Intelligence',i:'✦',f:ModMiner},
  {id:'timeline',t:'Replay Timeline',g:'Intelligence',i:'⏱',f:ModTimeline},
  {id:'diff',t:'Policy Diff',g:'Policy',i:'⇄',f:ModDiff},
  {id:'matrix',t:'Comparison Matrix',g:'Policy',i:'⊞',f:ModMatrix},
  {id:'tests',t:'Test Suite',g:'Quality',i:'⚗',f:ModTests},
  {id:'versions',t:'Versioning',g:'System',i:'≡',f:ModVersions},
  {id:'audit',t:'Audit Reports',g:'Compliance',i:'📋',f:ModAudit},
  {id:'governance',t:'Governance',g:'System',i:'🛡',f:ModGovernance},
  {id:'cli',t:'CLI Terminal',g:'Tools',i:'▶',f:ModCli},
  {id:'federation',t:'Federation',g:'Network',i:'🌍',f:ModFederation},
  {id:'evidence',t:'Evidence Chain',g:'Compliance',i:'⛓',f:ModEvidence}
];

var PINS_KEY='epistemic:pinned';
var pinned=[];
try{pinned=JSON.parse(localStorage.getItem(PINS_KEY)||'[]');}catch(e){pinned=['overview','topology','proofs','evidence'];}

function buildNav(){
  var nl=$('#navlist');nl.innerHTML='';
  var lastG=null;
  MODULES.forEach(function(m){
    if(m.g!==lastG){var g=document.createElement('div');g.className='ngroup';g.textContent=m.g;nl.appendChild(g);lastG=m.g;}
    var it=document.createElement('div');it.className='nitem';it.setAttribute('data-id',m.id);
    var c=Store.all(m.id==='overview'?'policies':m.id==='topology'?'shards':m.id==='proofs'?'proofs':m.id==='evidence'?'evidence':m.id==='audit'?'audit':'')||[];
    it.innerHTML='<span class="ic">'+m.i+'</span><span>'+esc(m.t)+'</span><span class="ct">'+(c.length||'')+'</span>';
    it.onclick=function(){location.hash='#/'+m.id;};
    nl.appendChild(it);
  });
  refreshCounts();
}
function refreshCounts(){
  var c=Store.counts();
  var total=0;for(var k in c)total+=c[k];
  $('#footCount').textContent=total+' records';
  $('#footHash').textContent='audit head: '+AuditLog.head().slice(0,16)+'…';
}
function route(){
  Bus.clear();
  var id=(location.hash||'#/overview').replace('#/','');
  var m=MODULES.filter(function(x){return x.id===id;})[0]||MODULES[0];
  $$('.nitem').forEach(function(it){it.classList.toggle('on',it.getAttribute('data-id')===m.id);});
  $('#vtitle').textContent=m.t;$('#vsub').textContent='· '+m.g.toLowerCase()+' · serverless';
  m.f();refreshCounts();$('#view').scrollTop=0;

  // Pin bar
  var pb=$('#pinbar');
  if(pb)pb.remove();
  if(pinned.length>0){
    pb=document.createElement('div');pb.className='pinbar';pb.id='pinbar';
    pb.innerHTML='<span style="font-size:9px;color:var(--dim2);letter-spacing:.1em;text-transform:uppercase">★ pinned</span>';
    pinned.forEach(function(pid){
      var pm=MODULES.filter(function(x){return x.id===pid;})[0];
      if(pm){var chip=document.createElement('span');chip.className='pchip'+(pid===m.id?' on':'');chip.innerHTML=pm.i+' '+esc(pm.t);chip.onclick=function(){location.hash='#/'+pid;};pb.appendChild(chip);}
    });
    view.insertBefore(pb,view.firstChild);
  }

  // Pin toggle button
  var pinBtn=document.createElement('button');pinBtn.className='btn sm';pinBtn.style.marginLeft='8px';
  var isPinned=pinned.indexOf(m.id)>=0;
  pinBtn.textContent=isPinned?'★ unpin':'☆ pin';
  pinBtn.onclick=function(){
    if(isPinned){pinned=pinned.filter(function(x){return x!==m.id;});}
    else{pinned.push(m.id);}
    localStorage.setItem(PINS_KEY,JSON.stringify(pinned));
    route();
  };
  $('#topbar').insertBefore(pinBtn,$('#btnExport'));
}
window.addEventListener('hashchange',route);

/* ── export/import/reset ── */
$('#btnExport').onclick=function(){
  download('epistemic-store.json',JSON.stringify({exported:new Date().toISOString(),store:Store.d,audit:AuditLog.export()},null,2),'application/json');
  Store.commit('export','full store snapshot');toast('store exported');
};
$('#btnImport').onclick=function(){$('#fileIn').click();};
$('#fileIn').onchange=function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var o=JSON.parse(r.result);if(o.store){Store.d=o.store;Store.save();}if(o.audit)AuditLog.import(o.audit);toast('imported · '+Store.counts().policies+' policies');route();}catch(err){toast('import failed: '+err.message,'bad');}};
  r.readAsText(f);
};
$('#btnReset').onclick=function(){if(confirm('Reset to seed data?')){seed();AuditLog.reset();toast('reset to seed','warn');route();}};

/* ── search ── */
$('#gsearch').addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;var q=e.target.value.trim().toLowerCase();if(!q)return;
  clear();
  var results=[];
  for(var k in Store.d){Store.d[k].forEach(function(r){if(JSON.stringify(r).toLowerCase().indexOf(q)>=0)results.push({collection:k,record:r});});}
  var host=document.createElement('div');host.className='cards';
  results.slice(0,20).forEach(function(r){
    var c=document.createElement('div');c.className='card';
    c.innerHTML='<div class="t">'+esc(r.collection)+'</div><div class="m"><span class="mono">'+esc(JSON.stringify(r.record).slice(0,120))+'</span></div>';
    host.appendChild(c);
  });
  view.appendChild(Panel('Search results',results.length+' matches for "'+esc(q)+'"',host));
});

/* ── register plugins ── */
Hooks.register({id:'plg-evidence-logger',name:'Evidence Logger',version:'1.0.0',hook:'evidence.intake',desc:'Logs evidence operations',callback:function(p){console.log('[plugin] evidence intake:',p);}});
Hooks.register({id:'plg-violation-alerter',name:'Violation Alerter',version:'1.0.0',hook:'invariant.violation',desc:'Alerts on invariant breaches',callback:function(p){console.log('[plugin] violation:',p);}});
Hooks.register({id:'plg-tamper-detector',name:'Tamper Detector',version:'1.0.0',hook:'evidence.tamper',desc:'Detects sealed evidence tampering',callback:function(p){console.warn('[plugin] TAMPER:',p);}});

/* ── boot ── */
Store.load();
if(!Store.d.policies||Store.d.policies.length===0){
  try{seed();console.log('[boot] seeded '+Store.d.policies.length+' policies');}
  catch(e){console.error('[boot] seed failed:',e);}
}
AuditLog.onAppend(function(){refreshCounts();});
buildNav();route();
console.log('[epistemic-runtime] serverless · offline-capable · '+MODULES.length+' sections · '+Store.counts().policies+' policies');

})();
</script>
</body>
</html>
