<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HUMAN TWIN — VVU Universal Anatomical Viewer</title>
<style>
  :root{
    --bg:#07090d; --panel:rgba(10,15,22,.86); --line:#1c2635;
    --txt:#c9d6e4; --dim:#7d8ca0; --cyan:#3fd8c7; --green:#35d07f;
    --amber:#e6b450; --red:#ff5c5c; --blue:#5ca7ff; --violet:#7C5CFF;
    --teal:#0FB5A8;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; overflow:hidden}
  body{background:var(--bg); color:var(--txt);
    font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    display:flex; flex-direction:column}

  /* Top bar */
  #topbar{flex:0 0 auto; height:46px; z-index:20;
    display:flex; align-items:center; gap:10px; padding:0 14px;
    background:linear-gradient(180deg, rgba(7,9,13,.97), rgba(7,9,13,.82));
    border-bottom:1px solid var(--line); overflow-x:auto; white-space:nowrap}
  .brand{font-weight:700; letter-spacing:.08em; color:#e8f2fb}
  .brand small{color:var(--cyan); font-weight:400; margin-left:8px}
  .badge{padding:3px 9px; border:1px solid var(--line); border-radius:3px;
    font-size:10.5px; letter-spacing:.04em; flex:0 0 auto}
  .b-proven{color:#8ff2c0; border-color:#1f5c3c; background:rgba(53,208,127,.10)}
  .b-loading{color:#a8cdf5; border-color:#2b4a6b; background:rgba(92,167,255,.10); animation:pulse 1.2s infinite}
  .b-blocked{color:#ffb1b1; border-color:#6e2a2a; background:rgba(255,92,92,.12)}
  .b-amber{color:#f0d194; border-color:#5c4a20; background:rgba(230,180,80,.10)}
  .b-neutral{color:var(--dim)}
  @keyframes pulse{50%{opacity:.55}}

  /* Main layout */
  #main{flex:1 1 auto; display:flex; min-height:0; overflow:hidden}
  #stage{flex:1 1 auto; position:relative; min-width:0; min-height:0; overflow:hidden}
  #stage canvas{display:block; width:100%; height:100%}

  /* Left rail — asset registry (desktop) */
  #asset-rail{flex:0 0 260px; background:var(--panel); border-right:1px solid var(--line);
    overflow-y:auto; padding:12px 14px 20px; display:none}
  @media (min-width:1024px){ #asset-rail{display:block} }

  /* Right inspector — telemetry (desktop) */
  #inspector{flex:0 0 300px; background:var(--panel); border-left:1px solid var(--line);
    overflow-y:auto; padding:12px 14px 20px; display:none}
  @media (min-width:1024px){ #inspector{display:block} }

  /* Bottom sheet HUD (mobile) */
  #hud{position:fixed; left:0; right:0; bottom:0; z-index:15;
    background:var(--panel); border-top:1px solid var(--line);
    max-height:45vh; overflow-y:auto; padding:12px 14px 20px;
    transition:transform .25s ease}
  @media (min-width:1024px){ #hud{display:none} }

  /* Shared HUD content */
  h2{font-size:11px; letter-spacing:.14em; color:var(--cyan); margin:14px 0 6px;
    border-bottom:1px solid var(--line); padding-bottom:4px}
  h2:first-child{margin-top:0}
  .kv{display:flex; justify-content:space-between; gap:8px; padding:2px 0; font-size:11px}
  .kv b{color:#e8f2fb; font-weight:600; text-align:right}
  .note{color:var(--dim); font-size:10.5px; margin-top:4px}
  .warn{color:var(--amber)}
  .row{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
  button{flex:1 1 auto; background:#0d141d; color:var(--txt);
    border:1px solid #2a3848; border-radius:4px; padding:7px 8px; font:inherit; font-size:10.5px;
    cursor:pointer; letter-spacing:.03em; min-height:44px}
  button:hover{border-color:var(--cyan); color:#eafffb}
  button.primary{border-color:#1f5c4c; background:rgba(63,216,199,.08)}
  button.danger{border-color:#5c2a2a; color:#ffb1b1}
  button.on{border-color:var(--green); color:#a9f2cd; background:rgba(53,208,127,.10)}
  button.off{opacity:.55}
  .layer-btn{flex:0 0 auto; min-width:70px}

  .slider-group{margin:8px 0}
  .slider-group label{display:flex; justify-content:space-between; font-size:10.5px; color:var(--dim); margin-bottom:2px}
  .slider-group input[type=range]{width:100%; accent-color:var(--cyan)}

  /* Layer status dots */
  .layer-dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px}
  .layer-skeletal{background:#e8e8e8}
  .layer-muscular{background:#c0392b}
  .layer-circulatory{background:#8b0000}
  .layer-nervous{background:#f0e68c}

  /* Footer */
  #foot{flex:0 0 auto; height:34px; z-index:20;
    display:flex; align-items:center; gap:14px; padding:0 14px;
    background:rgba(7,9,13,.95); border-top:1px solid var(--line);
    font-size:10px; color:var(--dim); white-space:nowrap; overflow:hidden}
  #foot .law{color:#8ff2c0}
  #log{margin-left:auto; display:flex; gap:10px; overflow:hidden}
  #log span{opacity:.85}
  #log span:first-child{opacity:1; color:#9fb3c8}

  .err-detail{margin-top:6px; padding:7px 9px; border:1px solid #6e2a2a; border-radius:4px;
    background:rgba(255,92,92,.07); color:#ffb1b1; font-size:10.5px; word-break:break-all; display:none}

  /* Mobile bottom sheet toggle */
  #hud-toggle{position:fixed; right:12px; bottom:calc(45vh + 8px); z-index:16;
    width:44px; height:44px; border-radius:50%; background:var(--panel);
    border:1px solid var(--line); color:var(--cyan); font-size:18px;
    display:flex; align-items:center; justify-content:center; cursor:pointer}
  @media (min-width:1024px){ #hud-toggle{display:none} }

  /* Asset provenance card */
  .asset-card{border:1px solid var(--line); border-radius:4px; padding:8px; margin:6px 0; font-size:10.5px}
  .asset-card .name{color:#e8f2fb; font-weight:600; margin-bottom:2px}
  .asset-card .stat{color:var(--dim)}
  .asset-card.proven{border-color:#1f5c3c}
  .asset-card.blocked{border-color:#6e2a2a; background:rgba(255,92,92,.07)}
</style>
</head>

<header id="topbar">
  <div class="brand">HUMAN TWIN // ANATOMICAL VIEWER<small>PATH A · v1</small></div>
  <div class="badge b-loading" id="b-asset">ASSET: LOADING…</div>
  <div class="badge b-amber" id="b-tele">TELEMETRY: SIMULATED</div>

<div id="main">
  <!-- Left rail: asset registry (desktop) -->
  <aside id="asset-rail">
    <h2>ASSET REGISTRY</h2>
    <div id="asset-list"></div>
    <h2>PROVENANCE</h2>
    <div id="provenance-list"></div>
  </aside>

  <!-- 3D viewport -->

  <!-- Right inspector: telemetry (desktop) -->
  <aside id="inspector">
    <h2>LAYER SELECTOR</h2>
    <div class="row">
      <button class="layer-btn on" id="btn-skeletal" onclick="toggleLayer('skeletal')">SKELETAL</button>
      <button class="layer-btn on" id="btn-muscular" onclick="toggleLayer('muscular')">MUSCULAR</button>
    </div>
    <div class="row">
      <button class="layer-btn on" id="btn-circulatory" onclick="toggleLayer('circulatory')">CIRCULATORY</button>
      <button class="layer-btn on" id="btn-nervous" onclick="toggleLayer('nervous')">NERVOUS</button>

    <h2>TELEMETRY (SIMULATED)</h2>
    <div class="slider-group">

</div>

<!-- Mobile bottom sheet HUD -->

  <h2>LAYER SELECTOR</h2>
  <div class="row">
    <button class="layer-btn on" id="m-btn-skeletal" onclick="toggleLayer('skeletal')">SKELETAL</button>
    <button class="layer-btn on" id="m-btn-muscular" onclick="toggleLayer('muscular')">MUSCULAR</button>

  <div class="row">
    <button class="layer-btn on" id="m-btn-circulatory" onclick="toggleLayer('circulatory')">CIRCULATORY</button>
    <button class="layer-btn on" id="m-btn-nervous" onclick="toggleLayer('nervous')">NERVOUS</button>
  </div>
  <div class="row">
    <button class="primary" onclick="showAll()">ALL</button>
    <button onclick="isolateLayer()">ISO</button>
    <button onclick="resetView()">RESET</button>
  </div>
  <h2>TELEMETRY (SIMULATED)</h2>
  <div class="slider-group">
    <label><span>HR</span><span id="m-hr-val">72 bpm</span></label>
    <input type="range" id="m-hr-slider" min="40" max="180" value="72" oninput="updateTelemetry('hr',this.value)">

  <div class="slider-group">

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ─── State ──────────────────────────────────────────────────────────────
const stage = document.getElementById('stage');
const logEl = document.getElementById('log');
const statusLog = document.getElementById('status-log');

const telemetry = {
  hr: 72,
  hyd: 0.8,
  str: 0.3,
  spo: 98,
  tmp: 36.6,
};

const layers = {
  skeletal: { visible: true, mesh: null, material: null },
  muscular: { visible: true, mesh: null, material: null },
  circulatory: { visible: true, mesh: null, material: null },
  nervous: { visible: true, mesh: null, material: null },
};

let renderer, scene, camera, controls;
let isoMode = false;
let isoLayer = null;

// ─── Logger ─────────────────────────────────────────────────────────────
function log(msg) {
  const span = document.createElement('span');
  span.textContent = msg;
  logEl.prepend(span);
  while (logEl.children.length > 6) logEl.removeChild(logEl.lastChild);
  if (statusLog) {
    const p = document.createElement('div');
    p.style.cssText = 'font-size:10.5px;color:var(--dim);padding:2px 0;border-bottom:1px solid var(--line)';
    p.textContent = new Date().toISOString().slice(11,19) + ' · ' + msg;
    statusLog.prepend(p);
    while (statusLog.children.length > 20) statusLog.removeChild(statusLog.lastChild);
  }
}

// ─── Renderer setup ─────────────────────────────────────────────────────
function initRenderer() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x07090d);

  camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.set(0, 1.2, 3.5);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  stage.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 1.5;
  controls.maxDistance = 8;
  controls.target.set(0, 1.0, 0);

  // Lighting
  const ambient = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambient);
  const key = new THREE.DirectionalLight(0xffffff, 1.2);
  key.position.set(2, 4, 3);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0x88ccff, 0.4);
  fill.position.set(-2, 2, -2);
  scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffaa88, 0.3);
  rim.position.set(0, -1, -3);
  scene.add(rim);

  // Grid floor
  const grid = new THREE.GridHelper(4, 20, 0x1c2635, 0x0d141d);
  grid.position.y = -0.01;
  scene.add(grid);

  fit();
  new ResizeObserver(fit).observe(stage);
  animate();
}

function fit() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (w > 0 && h > 0) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
}

// ─── Asset loading ──────────────────────────────────────────────────────
const loader = new GLTFLoader();

// Proven pipeline test fixture — NOT the body
const PIPELINE_TEST_URL = 'https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Assets@main/Models/DamagedHelmet/glTF-Binary/DamagedHelmet.glb';

// Attempt to load a real anatomical asset. If it fails, the layer stays
// BLOCKED_MISSING_ASSET — no primitive fallback, ever.
function tryLoadLayer(layerName, url, materialFactory) {
  return new Promise((resolve) => {
    loader.load(
      url,
      (gltf) => {
        const mesh = gltf.scene;
        mesh.traverse((child) => {
          if (child.isMesh) {
            child.material = materialFactory();
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });
        layers[layerName].mesh = mesh;
        layers[layerName].material = mesh.children.find(c => c.isMesh)?.material || null;
        scene.add(mesh);
        mesh.visible = layers[layerName].visible;
        log(`ASSET PROVEN · ${layerName} · ${url.split('/').pop()}`);
        resolve(true);
      },
      undefined,
      (err) => {
        console.warn(`BLOCKED_MISSING_ASSET · ${layerName} · ${err?.message || err}`);
        log(`BLOCKED_MISSING_ASSET · ${layerName}`);
        resolve(false);
      }
    );
  });
}

// ─── Materials (per layer spec) ──────────────────────────────────────────
function skeletalMaterial() {
  return new THREE.MeshPhysicalMaterial({
    color: 0xe8e8e8,
    roughness: 0.6,
    metalness: 0.0,
    transmission: 0.0,
    transparent: false,
    opacity: 1.0,
  });
}

function muscularMaterial() {
  return new THREE.MeshPhysicalMaterial({
    color: 0xc0392b,
    roughness: 0.7,
    metalness: 0.0,
    transmission: 0.15,
    attenuationColor: new THREE.Color(0xff6b4a),
    attenuationDistance: 0.5,
    transparent: true,
    opacity: 0.85,
  });
}

function circulatoryMaterial() {
  return new THREE.MeshPhysicalMaterial({
    color: 0x8b0000,
    roughness: 0.3,
    metalness: 0.1,
    emissive: new THREE.Color(0x440000),
    emissiveIntensity: 0.3,
    transparent: true,
    opacity: 0.7,
  });
}

function nervousMaterial() {
  return new THREE.MeshPhysicalMaterial({
    color: 0xf0e68c,
    roughness: 0.5,
    metalness: 0.0,
    transmission: 0.2,
    emissive: new THREE.Color(0x333300),
    emissiveIntensity: 0.2,
    transparent: true,
    opacity: 0.6,
  });
}

// ─── Telemetry binding ──────────────────────────────────────────────────
function applyTelemetry() {
  // Circulatory: blood flow speed + pulse intensity
  const hr = telemetry.hr;
  if (layers.circulatory.material) {
    const m = layers.circulatory.material;
    if (hr > 100) {
      m.emissiveIntensity = 0.3 + (hr - 100) / 80 * 0.7;
      m.attenuationDistance = 0.9 - (hr - 100) / 80 * 0.65;
    } else {
      m.emissiveIntensity = 0.2 + hr / 200 * 0.1;
      m.attenuationDistance = 0.9;
    }
    // SpO2 desaturation
    if (telemetry.spo < 95) {
      const desat = (95 - telemetry.spo) / 5;
      m.color.setRGB(0.55 + desat * 0.2, 0.0 + desat * 0.1, 0.0);
      m.emissive.setRGB(0.3 + desat * 0.2, 0.1, 0.0);
    } else {
      m.color.set(0x8b0000);
      m.emissive.set(0x440000);
    }
  }

  // Muscular: fibre tension
  if (layers.muscular.material) {
    const m = layers.muscular.material;
    if (telemetry.str > 0.7) {
      m.color.setRGB(0.85, 0.25, 0.15);
      m.emissiveIntensity = (telemetry.str - 0.7) * 0.5;
    } else {
      m.color.set(0xc0392b);
      m.emissiveIntensity = 0;
    }
  }

  // Nervous: signal propagation tied to stress
  if (layers.nervous.material) {
    const m = layers.nervous.material;
    m.emissiveIntensity = 0.1 + telemetry.str * 0.4;
  }

  // Full-body emissive: temperature
  const fever = telemetry.tmp > 38;
  scene.traverse((child) => {
    if (child.isMesh && child.material && child.material.emissiveIntensity !== undefined) {
      if (fever) {
        child.material.emissiveIntensity = Math.min(child.material.emissiveIntensity + 0.15, 1.0);
      }
    }
  });

  // Hydration: clearcoat on all layers
  const clearcoat = telemetry.hyd < 0.5 ? 1.0 : 0.05;
  const roughness = telemetry.hyd < 0.5 ? 0.05 : 0.55;
  Object.values(layers).forEach(l => {
    if (l.material) {
      l.material.clearcoat = clearcoat;
      l.material.clearcoatRoughness = roughness;
    }
  });

  log(`TELEMETRY UPDATE · HR ${telemetry.hr} · HYD ${telemetry.hyd.toFixed(2)} · STR ${telemetry.str.toFixed(2)} · SpO2 ${telemetry.spo} · TMP ${telemetry.tmp.toFixed(1)}`);
}

// ─── Layer controls ─────────────────────────────────────────────────────
function toggleLayer(name) {
  layers[name].visible = !layers[name].visible;
  if (layers[name].mesh) {
    layers[name].mesh.visible = layers[name].visible;
  }
  updateLayerButtons();
  log(`LAYER ${layers[name].visible ? 'ON' : 'OFF'} · ${name.toUpperCase()}`);
}

function updateLayerButtons() {
  ['skeletal','muscular','circulatory','nervous'].forEach(name => {
    document.querySelectorAll(`#btn-${name}, #m-btn-${name}`).forEach(btn => {
      if (btn) {
        btn.classList.toggle('on', layers[name].visible);
        btn.classList.toggle('off', !layers[name].visible);
      }
    });
  });
}

function showAll() {
  isoMode = false;
  isoLayer = null;
  Object.keys(layers).forEach(k => {
    layers[k].visible = true;
    if (layers[k].mesh) layers[k].mesh.visible = true;
  });
  updateLayerButtons();
  log('LAYER MODE · ALL');
}

function isolateLayer() {
  const visible = Object.keys(layers).filter(k => layers[k].visible);
  if (visible.length === 1 && isoMode) {
    showAll();
    return;
  }
  // Isolate the first visible layer
  const target = visible[0] || 'skeletal';
  isoMode = true;
  isoLayer = target;
  Object.keys(layers).forEach(k => {
    layers[k].visible = (k === target);
    if (layers[k].mesh) layers[k].mesh.visible = (k === target);
  });
  updateLayerButtons();
  log(`LAYER MODE · ISO · ${target.toUpperCase()}`);
}

function resetView() {
  camera.position.set(0, 1.2, 3.5);
  controls.target.set(0, 1.0, 0);
  controls.update();
  log('VIEW RESET');
}

function updateTelemetry(key, value) {
  if (key === 'hr') { telemetry.hr = parseInt(value); document.getElementById('hr-val').textContent = value + ' bpm'; document.getElementById('m-hr-val').textContent = value + ' bpm'; }
  if (key === 'hyd') { telemetry.hyd = parseFloat(value); document.getElementById('hyd-val').textContent = parseFloat(value).toFixed(2); document.getElementById('m-hyd-val').textContent = parseFloat(value).toFixed(2); }
  if (key === 'str') { telemetry.str = parseFloat(value); document.getElementById('str-val').textContent = parseFloat(value).toFixed(2); document.getElementById('m-str-val').textContent = parseFloat(value).toFixed(2); }
  if (key === 'spo') { telemetry.spo = parseInt(value); document.getElementById('spo-val').textContent = value + ' %'; document.getElementById('m-spo-val').textContent = value + ' %'; }
  if (key === 'tmp') { telemetry.tmp = parseFloat(value); document.getElementById('tmp-val').textContent = parseFloat(value).toFixed(1) + ' °C'; document.getElementById('m-tmp-val').textContent = parseFloat(value).toFixed(1) + ' °C'; }
  applyTelemetry();
}

function toggleHud() {
  const hud = document.getElementById('hud');
  hud.style.transform = hud.style.transform === 'translateY(100%)' ? '' : 'translateY(100%)';
}

// ─── Animation loop ─────────────────────────────────────────────────────
let lastTime = 0;
function animate(time) {
  requestAnimationFrame(animate);
  const dt = (time - lastTime) / 1000;
  lastTime = time;
  controls.update();

  // Circulatory pulse wave
  if (layers.circulatory.mesh && layers.circulatory.visible) {
    const pulse = 0.5 + 0.5 * Math.sin(time * 0.003 * (telemetry.hr / 60));
    if (layers.circulatory.material) {
      layers.circulatory.material.emissiveIntensity = 0.2 + pulse * 0.3;
    }
  }

  // Nervous signal propagation
  if (layers.nervous.mesh && layers.nervous.visible) {
    const sig = 0.5 + 0.5 * Math.sin(time * 0.002 * (1 + telemetry.str * 2));
    if (layers.nervous.material) {
      layers.nervous.material.emissiveIntensity = 0.1 + sig * 0.3;
    }
  }

  renderer.render(scene, camera);
}

// ─── Asset loading sequence ──────────────────────────────────────────────
async function loadAssets() {
  const assetList = document.getElementById('asset-list');
  const provenanceList = document.getElementById('provenance-list');

  // Pipeline test fixture (DamagedHelmet) — proves renderer works, NOT the body
  const testCard = document.createElement('div');
  testCard.className = 'asset-card';
  testCard.innerHTML = '<div class="name">DamagedHelmet.glb</div><div class="stat">Pipeline test fixture · 3,773,916 B · Khronos · embedded PBR</div>';
  assetList.appendChild(testCard);

  // Real anatomical GLB assets — mapped per layer.
  // No primitives. No fallback geometry. Real assets or BLOCKED_MISSING_ASSET.
  const layerAssets = {
    skeletal: 'female_human_skeleton_full_body_anatomy_3d_model.glb',
    muscular: 'perfect_human_body.glb',
    circulatory: 'circulatory-system-figure.glb',
    nervous: 'human_brain_cerebrum__brainstem.glb',
  };

  const layerMaterialFactory = {
    skeletal: skeletalMaterial,
    muscular: muscularMaterial,
    circulatory: circulatoryMaterial,
    nervous: nervousMaterial,
  };

  // Load pipeline test fixture to prove renderer (DamagedHelmet — proven asset)
  await tryLoadLayer('_pipeline_test', PIPELINE_TEST_URL, () => {
    const m = new THREE.MeshPhysicalMaterial({ color: 0x888888, roughness: 0.4, metalness: 0.3 });
    m.userData = { layer: 'test' };
    return m;
  });

  // Remove pipeline test from scene (it proved the pipeline, not the body)
  const testMesh = layers['_pipeline_test']?.mesh;
  if (testMesh) {
    scene.remove(testMesh);
    delete layers['_pipeline_test'];
  }

  // Load real anatomical assets per layer
  const layerNames = ['skeletal','muscular','circulatory','nervous'];
  let provenCount = 0;
  for (const layerName of layerNames) {
    const url = layerAssets[layerName];
    const factory = layerMaterialFactory[layerName];
    const ok = await tryLoadLayer(layerName, url, factory);

    const card = document.createElement('div');
    const prov = document.createElement('div');
    if (ok) {
      card.className = 'asset-card proven';
      card.innerHTML = `<div class="name">${layerName.toUpperCase()}</div><div class="stat">PROVEN · ${url} · loaded</div>`;
      prov.className = 'asset-card proven';
      prov.innerHTML = `<div class="name">${layerName.toUpperCase()}</div><div class="stat">Real GLB · maps bound · No-Primitives Law satisfied</div>`;
      provenCount++;
    } else {
      card.className = 'asset-card blocked';
      card.innerHTML = `<div class="name">${layerName.toUpperCase()}</div><div class="stat">BLOCKED_MISSING_ASSET · ${url} failed to load</div>`;
      prov.className = 'asset-card blocked';
      prov.innerHTML = `<div class="name">${layerName.toUpperCase()}</div><div class="stat">Load failed · zero fallback geometry · No-Primitives Law enforced</div>`;
    }
    assetList.appendChild(card);
    provenanceList.appendChild(prov);
  }

  // Additional available assets (not mapped to a layer — inventoried)
  const extraAssets = [
    { name: 'front_body_anatomy.glb', role: 'Full-body front anatomy · 13,799,544 B', layer: 'muscular (alt)' },
    { name: 'realistic_human_lungs.glb', role: 'Respiratory system · 17,147,352 B', layer: 'circulatory (alt)' },
    { name: 'skeleton_animated.glb', role: 'Animated skeleton · 4,517,624 B', layer: 'skeletal (alt)' },
    { name: 'human_brain_cerebrum__brainstem.glb', role: 'Brain + brainstem · 12,230,544 B', layer: 'nervous (alt)' },
    { name: 'digestive_system.glb', role: 'Digestive system · 2,585,176 B', layer: 'circulatory (alt)' },
    { name: 'human_organs.glb', role: 'Organ set · 2,855,552 B', layer: 'circulatory (alt)' },
  ];
  const extraHeader = document.createElement('div');
  extraHeader.style.cssText = 'font-size:10px;letter-spacing:.12em;color:var(--dim);margin:12px 0 4px;border-bottom:1px solid var(--line);padding-bottom:2px';
  extraHeader.textContent = 'ADDITIONAL ASSETS (INVENTORIED)';
  assetList.appendChild(extraHeader);
  for (const a of extraAssets) {
    const card = document.createElement('div');
    card.className = 'asset-card';
    card.innerHTML = `<div class="name">${a.name}</div><div class="stat">${a.role} · ${a.layer}</div>`;
    assetList.appendChild(card);
  }

  // Update status badge
  const bAsset = document.getElementById('b-asset');
  if (provenCount === layerNames.length) {
    bAsset.textContent = `ASSET: PROVEN (${provenCount}/${layerNames.length})`;
    bAsset.className = 'badge b-proven';
  } else if (provenCount > 0) {
    bAsset.textContent = `ASSET: PARTIAL (${provenCount}/${layerNames.length})`;
    bAsset.className = 'badge b-amber';
  } else {
    bAsset.textContent = 'ASSET: BLOCKED_MISSING_ASSET';
    bAsset.className = 'badge b-blocked';
  }

  log(`HUMAN TWIN · ${provenCount}/${layerNames.length} LAYERS PROVEN · NO PRIMITIVES LAW ENFORCED`);
}

// ─── Boot ───────────────────────────────────────────────────────────────
initRenderer();
loadAssets();
applyTelemetry();
log('HUMAN TWIN booted · v1 · simulated telemetry');
</script>
