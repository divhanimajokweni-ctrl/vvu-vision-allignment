        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{
          --bg-void:#0a0f0a; --bg-crust:#0c140c; --bg-panel:#0f1710;
          --bg-elevated:#111a11; --bg-inset:#121f13;
          --bg-overlay:rgba(15,23,16,.90); --bg-veil:rgba(10,15,10,.85);
          --acc:#b5d6a0; --acc-soft:#c8e6b8;
          --acc-30:rgba(181,214,160,.30); --acc-25:rgba(181,214,160,.25);
          --acc-20:rgba(181,214,160,.20); --acc-10:rgba(181,214,160,.10);
          --acc-05:rgba(181,214,160,.05); --acc-03:rgba(181,214,160,.03);
          --line:#0f1710; --line-soft:#1a2a1a; --line-med:#1d321d;
          --line-acc-20:rgba(181,214,160,.20); --line-acc-10:rgba(181,214,160,.10);
          --w-90:rgba(255,255,255,.9); --w-70:rgba(255,255,255,.7);
          --w-50:rgba(255,255,255,.5); --w-30:rgba(255,255,255,.3);
          --w-20:rgba(255,255,255,.2); --w-10:rgba(255,255,255,.1);
          --warn:#e8c07a; --alert:#e89a8a;
          --font-ui:'Inter',system-ui,-apple-system,sans-serif;
          --font-data:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
          --glow-sm:0 0 8px #b5d6a0; --glow-md:0 0 14px #b5d6a0;
          --glow-lg:0 0 30px rgba(181,214,160,.25); --glow-xl:0 0 80px rgba(181,214,160,.08);
          --r-sm:4px; --r-md:6px; --r-lg:8px;
        }
        body{background:var(--bg-void);color:var(--w-90);font-family:var(--font-ui);font-size:11px;line-height:1.35;-webkit-font-smoothing:antialiased;overflow:hidden}
        .app{display:grid;grid-template-rows:36px 1fr 28px;grid-template-columns:240px 1fr;grid-template-areas:"top top" "left main" "bottom bottom";height:100%;width:100%;transition:grid-template-columns 200ms ease, grid-template-rows 200ms ease}
        .top-rail{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--bg-crust);border-bottom:1px solid var(--line-acc-10);font-family:var(--font-data);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--w-70);white-space:nowrap;overflow:hidden}
        .brand{color:var(--acc);font-weight:900;letter-spacing:.22em}
        .sep{color:var(--w-20)} .grow{flex:1}
        .view-switch{display:flex;gap:0;border:1px solid var(--line-med);border-radius:var(--r-sm);overflow:hidden}
        .view-switch button{background:transparent;border:0;padding:3px 9px;font:inherit;letter-spacing:.14em;color:var(--w-50);cursor:pointer;text-transform:uppercase;border-right:1px solid var(--line-med);transition:all 120ms}
        .view-switch button:last-child{border-right:0}
        .view-switch button:hover{color:var(--acc);background:var(--acc-05)}
        .view-switch button.on{background:var(--acc-10);color:var(--acc);box-shadow:inset 0 -1px 0 var(--acc)}
        .left-rail{grid-area:left;background:var(--bg-veil);border-right:1px solid var(--line-med);backdrop-filter:blur(12px);overflow-y:auto;padding:6px 0;position:relative}
        .rail-header{display:flex;align-items:center;gap:8px;padding:12px 14px 6px;font-family:var(--font-data);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--w-50)}
        .rail-header::before{content:'';width:2px;height:10px;background:var(--acc)}
        .rail-header .meta{margin-left:auto;color:var(--w-30);font-size:9px}
        .rail-item{display:flex;align-items:center;gap:9px;padding:7px 14px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--w-70);cursor:pointer;border-left:2px solid transparent;transition:all 150ms cubic-bezier(.4,0,.2,1)}
        .rail-item:hover{background:var(--acc-05);color:var(--acc)}
        .rail-item.on{background:var(--acc-05);color:var(--acc);border-left-color:var(--acc)}
        .rail-item.off{color:var(--w-30);border-left-color:transparent}
        .rail-item .name{flex:1} .rail-item .metric{font-family:var(--font-data);font-size:10px;color:var(--acc)}
        .rail-item.off .metric{color:var(--w-30)}
        .decim{padding:8px 14px 12px;border-bottom:1px solid var(--line-soft)}
        .decim-row{display:grid;grid-template-columns:52px 1fr 32px;gap:6px;align-items:center;padding:2px 0;font-family:var(--font-data);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--w-50)}
        .decim-bar{position:relative;height:3px;background:var(--acc-05);border-radius:2px;overflow:hidden}
        .decim-bar i{display:block;height:100%;background:var(--acc);transition:width 220ms}
        .decim-bar i.pulse{background:var(--acc);box-shadow:var(--glow-sm)}
        .viewport{grid-area:main;position:relative;background:var(--bg-void);overflow:hidden}
        .grid-bg{position:absolute;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(ellipse at center,rgba(181,214,160,.14) 1px,transparent 1px);background-size:14px 14px}
        canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
        .bracket{position:absolute;width:20px;height:20px;pointer-events:none;border-color:var(--acc);opacity:.8}
        .bracket.tl{top:0;left:0;border-top:2px solid;border-left:2px solid}
        .bracket.tr{top:0;right:0;border-top:2px solid;border-right:2px solid}
        .bracket.bl{bottom:0;left:0;border-bottom:2px solid;border-left:2px solid}
        .bracket.br{bottom:0;right:0;border-bottom:2px solid;border-right:2px solid}
        .hud{position:absolute;background:var(--bg-overlay);border:1px solid var(--line-acc-20);border-radius:var(--r-lg);backdrop-filter:blur(24px);padding:10px 12px;font-family:var(--font-data);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--w-70);min-width:180px;transition:opacity 180ms, transform 180ms}
        .hud.tl{top:16px;left:16px} .hud.tr{top:16px;right:16px}
        .hud.bl{bottom:16px;left:16px} .hud.br{bottom:16px;right:16px}
        .kicker{display:flex;align-items:center;gap:7px;font-size:9px;letter-spacing:.18em;color:var(--w-50);margin-bottom:8px}
        .kicker::before{content:'';width:2px;height:10px;background:var(--acc)}
        .row{display:flex;justify-content:space-between;gap:14px;padding:2px 0;font-size:10px}
        .row .v{color:var(--acc)}
        .bottom-strip{grid-area:bottom;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--bg-crust);border-top:1px solid var(--line-acc-10);font-family:var(--font-data);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--w-70);white-space:nowrap;overflow:hidden}
        .palette{position:fixed;top:18%;left:50%;transform:translateX(-50%);width:480px;background:var(--bg-overlay);border:1px solid var(--acc-30);border-radius:var(--r-lg);backdrop-filter:blur(24px);box-shadow:var(--glow-lg);z-index:100;overflow:hidden;animation:palette-in 180ms ease-out}
        @keyframes palette-in{from{transform:translateX(-50%) scale(.96);opacity:0} to{transform:translateX(-50%) scale(1);opacity:1}}
        .palette input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line-med);padding:14px 16px;color:var(--acc);font-family:var(--font-data);font-size:13px;outline:none;caret-color:var(--acc)}
        .palette .results{max-height:340px;overflow-y:auto}
        .palette .cmd{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--w-70);cursor:pointer;border-left:2px solid transparent}
        .palette .cmd:hover,.palette .cmd.sel{background:var(--acc-10);color:var(--acc);border-left-color:var(--acc)}
        .palette .cmd .hint{margin-left:auto;color:var(--w-30);font-family:var(--font-data);font-size:10px}
        .palette .cmd .tag{font-family:var(--font-data);font-size:9px;color:var(--w-30);padding:1px 6px;border:1px solid var(--line-med);border-radius:99px;text-transform:uppercase}
        .chain-drawer{position:absolute;top:0;right:0;bottom:0;width:340px;z-index:60;background:var(--bg-overlay);border-left:1px solid var(--line-acc-20);backdrop-filter:blur(24px);display:flex;flex-direction:column;animation:drawer-in 220ms cubic-bezier(.4,0,.2,1)}
        @keyframes drawer-in{from{transform:translateX(30px);opacity:0} to{transform:none;opacity:1}}
        .chain-head{padding:12px 14px;border-bottom:1px solid var(--line-med);display:flex;align-items:center;gap:10px}
        .chain-head h3{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);font-weight:700}
        .chain-head .close{margin-left:auto;background:transparent;border:0;color:var(--w-50);font:inherit;cursor:pointer;letter-spacing:.14em;font-size:10px}
        .chain-head .close:hover{color:var(--acc)}
        .chain-list{flex:1;overflow-y:auto;padding:6px 0}
        .chain-entry{padding:9px 14px;border-bottom:1px solid var(--line-soft);font-family:var(--font-data);font-size:10px;letter-spacing:.05em;cursor:pointer;transition:background 120ms}
        .chain-entry:hover{background:var(--acc-03)}
        .chain-entry.top{background:var(--acc-05);border-left:2px solid var(--acc)}
        .chain-entry .head{display:flex;justify-content:space-between;color:var(--acc);font-size:10px}
        .chain-entry .prev{margin-top:3px;color:var(--w-30);font-size:9px}
        .chain-entry .kind{margin-top:2px;color:var(--w-50);font-size:9px;text-transform:uppercase;letter-spacing:.12em}
        .chain-foot{padding:10px 14px;border-top:1px solid var(--line-med);display:flex;gap:10px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--w-50)}
        .ops-console{position:absolute;left:16px;right:16px;bottom:16px;z-index:55;background:var(--bg-overlay);border:1px solid var(--line-acc-20);border-radius:var(--r-lg);backdrop-filter:blur(24px);max-height:210px;display:flex;flex-direction:column;animation:console-in 220ms cubic-bezier(.4,0,.2,1)}
        @keyframes console-in{from{transform:translateY(20px);opacity:0} to{transform:none;opacity:1}}
        .ops-head{padding:10px 14px;border-bottom:1px solid var(--line-med);display:flex;align-items:center;gap:10px;font-family:var(--font-data);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--w-50)}
        .ops-head h3{color:var(--acc);font-weight:700}
        .ops-head .close{margin-left:auto;background:transparent;border:0;color:var(--w-50);font:inherit;cursor:pointer;font-size:10px;letter-spacing:.14em}
        .ops-head .close:hover{color:var(--acc)}
        .ops-body{overflow-y:auto;padding:4px 0}
        .ops-row{display:grid;grid-template-columns:80px 100px 1fr 90px;gap:10px;align-items:center;padding:7px 14px;font-family:var(--font-data);font-size:10px;letter-spacing:.05em;border-bottom:1px solid var(--line-soft)}
        .ops-row .t{color:var(--w-30)}
        .ops-row .pri{font-size:9px;letter-spacing:.14em;text-transform:uppercase}
        .ops-row .pri.hi{color:var(--alert)} .ops-row .pri.md{color:var(--warn)} .ops-row .pri.lo{color:var(--acc)}
        .ops-row .act{color:var(--w-90)}
        .ops-row .st{text-align:right;text-transform:uppercase;letter-spacing:.14em;font-size:9px}
        .ops-row .st.queued{color:var(--w-50)}
        .ops-row .st.running{color:var(--acc)} .ops-row .st.running::after{content:' ●';animation:pulse 1s infinite}
        .ops-row .st.done{color:var(--acc)} .ops-row .st.failed{color:var(--alert)}
        .pip{width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:var(--glow-sm);display:inline-block;flex-shrink:0}
        .pip.pulse{animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
        @keyframes pulse{50%{opacity:.5}}
        .mono{font-family:var(--font-data)} .acc{color:var(--acc)}
        .dim{color:var(--w-50)} .dimmer{color:var(--w-30)}

        /* Pin specifics from brief */
        .pin-btn{background:transparent;border:1px solid var(--line-med);border-radius:4px;padding:1px 5px;font-size:11px;color:var(--w-30);cursor:pointer;line-height:1;transition:all 120ms;margin-left:6px}
        .pin-btn:hover{color:var(--acc);border-color:var(--acc-30);background:var(--acc-05)}
        .top-rail.pinned-hidden, .left-rail.pinned-hidden, .bottom-strip.pinned-hidden, .hud.pinned-hidden{display:none !important}
        .app.top-pinned-hidden{grid-template-rows:0 1fr 28px}
        .app.bottom-pinned-hidden{grid-template-rows:36px 1fr 0}
        .app.top-pinned-hidden.bottom-pinned-hidden{grid-template-rows:0 1fr 0}
        .app.left-pinned-hidden{grid-template-columns:0 1fr}
