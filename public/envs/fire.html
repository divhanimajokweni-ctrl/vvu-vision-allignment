<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FIRE · Adversarial Testing Environment</title>
<style>
:root{
  --bg:#0a0e13;--bg2:#0e141c;--panel:#111a24;--panel2:#0d151e;--line:#1c2836;--line2:#26374a;
  --txt:#dce8f2;--dim:#75899c;--dim2:#4e6172;--acc:#37d6a0;--acc2:#3aa9f5;--warn:#f5b944;--bad:#f2607a;--pur:#a78bfa;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --tap:44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);
  font-family:var(--mono);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  min-height:100dvh;
  padding-bottom:calc(64px + var(--safe-b));
}

/* ============ MOBILE-FIRST SHELL ============ */
#app{display:flex;flex-direction:column;min-height:100dvh}

/* --- Top bar (mobile: brand + actions) --- */
#topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:10px;
  padding:calc(10px + var(--safe-t)) 12px 10px;
  background:rgba(14,20,28,.92);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
#topbar h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.06em;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .sub{display:none;font-size:10px;color:var(--dim2);letter-spacing:.1em}
#brandmark{font-weight:700;letter-spacing:.2em;color:var(--bad);font-size:14px}
#brandmark span{display:none}

/* --- Desktop sidebar (hidden on mobile) --- */
#nav{display:none}
#navfoot{display:none}

/* --- Main scroll area --- */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#view{flex:1;padding:12px;overflow-x:hidden}

/* --- Bottom tab bar (mobile primary nav) --- */
#tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  display:flex;justify-content:space-around;align-items:stretch;
  background:rgba(13,20,29,.96);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);
  height:calc(60px + var(--safe-b));
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--dim2);font-size:10px;letter-spacing:.04em;
  cursor:pointer;user-select:none;min-height:var(--tap);
  border-top:2px solid transparent;transition:color .15s;
}
.tab .ti{font-size:18px;line-height:1}
.tab.on{color:var(--bad);border-top-color:var(--bad)}
.tab:active{background:rgba(242,96,122,.06)}

/* --- Overflow "more" sheet --- */
#sheet{
  position:fixed;inset:0;z-index:70;display:none;
  background:rgba(0,0,0,.55);backdrop-filter:blur(2px);
}
#sheet.open{display:flex;align-items:flex-end}
#sheet .inner{
  width:100%;background:var(--panel);border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;padding:16px 14px calc(16px + var(--safe-b));
  max-height:70dvh;overflow-y:auto;animation:sheetUp .22s ease-out;
}
@keyframes sheetUp{from{transform:translateY(100%)}}
#sheet .grab{width:36px;height:4px;background:var(--line2);border-radius:4px;margin:0 auto 14px}
#sheet h3{margin:0 0 10px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim2)}
.sheet-item{
  display:flex;align-items:center;gap:12px;padding:13px 4px;
  border-bottom:1px solid var(--line);cursor:pointer;min-height:var(--tap);
}
.sheet-item:last-child{border-bottom:0}
.sheet-item .si{width:22px;text-align:center;font-size:16px;color:var(--acc2)}
.sheet-item.on .si{color:var(--bad)}
.sheet-item .st{flex:1;font-size:14px}
.sheet-item .sc{font-size:11px;color:var(--dim2);background:#16212d;
  border:1px solid var(--line);border-radius:20px;padding:1px 8px}

/* ============ PANELS ============ */
.panel{
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;
}
.ph{display:flex;align-items:center;gap:9px;padding:12px 14px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph h2{margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--bad);font-weight:600}
.ph .hint{font-size:11px;color:var(--dim2)}
.pb{padding:14px}

/* ============ GRIDS (mobile: stack) ============ */
.grid{display:grid;gap:12px}
.g2,.g3,.g21,.g12{grid-template-columns:1fr}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:12px}
.kpi{background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:11px;padding:11px 12px}
.kpi .l{font-size:9.5px;letter-spacing:.12em;color:var(--dim2);text-transform:uppercase;
  line-height:1.3}
.kpi .v{font-size:22px;margin-top:5px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .d{font-size:10px;color:var(--dim);margin-top:4px}
.kpi.a .v{color:var(--acc)}.kpi.b .v{color:var(--acc2)}
.kpi.w .v{color:var(--warn)}.kpi.r .v{color:var(--bad)}

/* ============ BUTTONS (touch-sized) ============ */
.btn{
  background:#16222e;border:1px solid var(--line);color:var(--dim);
  border-radius:10px;padding:11px 14px;font:inherit;font-size:13px;
  cursor:pointer;white-space:nowrap;min-height:var(--tap);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:border-color .15s,color .15s,background .15s;
}
.btn:active{transform:scale(.97)}
.btn:hover{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.35;cursor:default}
.btn.p{background:rgba(242,96,122,.1);border-color:rgba(242,96,122,.4);color:var(--bad)}
.btn.p:hover{background:rgba(242,96,122,.18)}
.btn.sm{padding:8px 11px;font-size:12px;min-height:36px}
.btn.ok{border-color:rgba(55,214,160,.4);color:var(--acc)}
.btn.ok:hover{border-color:var(--acc);color:var(--acc)}
.btn.block{width:100%}

/* ============ FORMS (mobile: full-width, big inputs) ============ */
.frm{display:grid;grid-template-columns:1fr;gap:11px;align-items:end}
.fld label{display:block;font-size:10px;letter-spacing:.12em;color:var(--dim2);
  text-transform:uppercase;margin-bottom:5px}
.fld input,.fld select,.fld textarea{
  width:100%;background:#0b1219;border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:12px 12px;font:inherit;font-size:16px;outline:none;
  min-height:var(--tap);
}
.fld textarea{resize:vertical;min-height:80px;font-size:14px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .btn{flex:1 1 auto}

/* ============ TABLES (horizontal scroll on mobile) ============ */
.tbar{display:flex;gap:8px;align-items:center;padding:11px 12px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.tbar input,.tbar select{
  background:#0b1219;border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;outline:none;
  min-height:var(--tap);flex:1 1 140px;
}
.tbar .cnt{font-size:11px;color:var(--dim2)}
.tbar .acts{margin-left:auto;display:flex;gap:6px}
.twrap{overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
th{text-align:left;padding:10px 12px;color:var(--dim2);font-weight:600;
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  border-bottom:1px solid var(--line);cursor:pointer;user-select:none;
  white-space:nowrap;position:sticky;top:0;background:var(--panel2);z-index:2}
th:hover{color:var(--txt)}
th .ar{color:var(--bad);font-size:9px}
td{padding:11px 12px;border-bottom:1px solid #16202b;vertical-align:middle;
  white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#141f2b}
tbody tr:active td{background:#18242f}
tbody tr.sel td{background:rgba(242,96,122,.11)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:160px}

/* ============ BADGES ============ */
.b{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;
  letter-spacing:.05em;border:1px solid;white-space:nowrap;line-height:1.5}
.b.ok{color:var(--acc);border-color:rgba(55,214,160,.35);background:rgba(55,214,160,.09)}
.b.info{color:var(--acc2);border-color:rgba(58,169,245,.35);background:rgba(58,169,245,.09)}
.b.warn{color:var(--warn);border-color:rgba(245,185,68,.35);background:rgba(245,185,68,.09)}
.b.bad{color:var(--bad);border-color:rgba(242,96,122,.35);background:rgba(242,96,122,.09)}
.b.mut{color:var(--dim2);border-color:var(--line);background:#131c26}
.b.pur{color:var(--pur);border-color:rgba(167,139,250,.35);background:rgba(167,139,250,.09)}

/* ============ LISTS ============ */
.alist{display:flex;flex-direction:column}
.arow{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;
  border-bottom:1px solid #16202b;font-size:12.5px}
.arow:last-child{border-bottom:0}
.arow .tm{color:var(--dim2);font-size:10px;white-space:nowrap;margin-left:auto;
  text-align:right;flex:none}
.arow .sv{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.sv.crit{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.sv.warn{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.sv.info{background:var(--acc2);box-shadow:0 0 8px var(--acc2)}
.sv.ok{background:var(--acc);box-shadow:0 0 8px var(--acc)}

/* ============ KEY-VALUE ============ */
.kv{display:grid;grid-template-columns:1fr;gap:4px 12px;font-size:12.5px}
.kv dt{color:var(--dim2);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  margin-top:6px}
.kv dd{margin:0;color:var(--txt);word-break:break-word}

/* ============ HINTS / CODE ============ */
.hint{font-size:12px;color:var(--dim2);line-height:1.7}
.code{background:#0a1017;border:1px solid var(--line);border-radius:10px;padding:12px;
  font-size:11px;color:#9fd0e8;white-space:pre-wrap;word-break:break-word;
  line-height:1.65;max-height:50dvh;overflow:auto;-webkit-overflow-scrolling:touch}
.mono{font-family:var(--mono);color:var(--dim);font-size:11px;word-break:break-all}

/* ============ TAGS ============ */
.tag{display:inline-block;background:#16212d;border:1px solid var(--line);
  border-radius:20px;padding:2px 9px;font-size:10px;color:var(--dim);
  margin:2px 3px 2px 0}
.tag.a{color:var(--acc);border-color:rgba(55,214,160,.35)}
.tag.b{color:var(--acc2);border-color:rgba(58,169,245,.35)}
.tag.w{color:var(--warn);border-color:rgba(245,185,68,.35)}
.tag.r{color:var(--bad);border-color:rgba(242,96,122,.35)}
.tag.p{color:var(--pur);border-color:rgba(167,139,250,.35)}

/* ============ CHECKLIST ============ */
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;
  border-bottom:1px solid #16202b;font-size:12.5px}
.chk:last-child{border-bottom:0}
.chk .mk{width:18px;flex:none;font-weight:700;font-size:15px}
.chk.pass .mk{color:var(--acc)}.chk.fail .mk{color:var(--bad)}
.chk .nm{color:var(--txt)}
.chk .dt{color:var(--dim2);font-size:11px;margin-top:4px;word-break:break-word}

/* ============ GATE ============ */
.gate{border:1px solid var(--bad);border-radius:12px;padding:14px;
  background:rgba(242,96,122,.06);margin-bottom:12px}
.gate.ok{border-color:rgba(55,214,160,.4);background:rgba(55,214,160,.06)}
.gate .gt{font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--bad);margin-bottom:8px;font-weight:600}
.gate.ok .gt{color:var(--acc)}

/* ============ GAP TABLE ============ */
.gap{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:10px;min-width:600px}
.gap th{background:transparent;position:static;cursor:default}
.gap td{white-space:normal;padding:7px 9px;vertical-align:top}
.gap td.r{color:var(--bad)}
.gap td.g{color:var(--acc)}
.gap td.y{color:var(--warn)}

/* ============ TOASTS ============ */
#toast{position:fixed;bottom:calc(74px + var(--safe-b));left:12px;right:12px;
  display:flex;flex-direction:column;gap:8px;z-index:99;pointer-events:none}
.tst{background:#121b26;border:1px solid var(--bad);border-left-width:3px;
  border-radius:10px;padding:11px 14px;font-size:12.5px;
  box-shadow:0 8px 26px rgba(0,0,0,.55);animation:tin .18s ease-out}
.tst.warn{border-color:var(--warn)}.tst.bad{border-color:var(--bad)}
.tst.ok{border-color:var(--acc)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* ============ SCROLLBARS ============ */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#0a0f15}
::-webkit-scrollbar-thumb{background:#22323f;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#31465a}

/* ==========================================================================
   UPSCALE — progressive enhancement upward
   ========================================================================== */

/* --- Small tablet (≥560px): 2-col KPIs, form grid --- */
@media(min-width:560px){
  #view{padding:16px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(148px,1fr))}
  .frm{grid-template-columns:repeat(2,1fr)}
  .kv{grid-template-columns:auto 1fr;gap:5px 14px}
  .kv dt{margin-top:0}
  .row .btn{flex:0 1 auto}
  table{min-width:0}
}

/* --- Tablet (≥760px): 2-col content grids, show more nav --- */
@media(min-width:760px){
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g21{grid-template-columns:2fr 1fr}
  .g12{grid-template-columns:1fr 2fr}
  body{padding-bottom:0}
  #tabbar{display:none}
  #app{display:grid;grid-template-columns:200px 1fr;min-height:100dvh}
  #nav{
    display:flex;flex-direction:column;overflow:hidden;
    background:linear-gradient(180deg,#0d141d,#0a0f15);
    border-right:1px solid var(--line);
    position:sticky;top:0;height:100dvh;
  }
  #navlist{flex:1;overflow-y:auto;padding:6px 0;-webkit-overflow-scrolling:touch}
  .ngroup{font-size:9.5px;letter-spacing:.18em;color:var(--dim2);
    padding:12px 14px 5px;text-transform:uppercase}
  .nitem{display:flex;align-items:center;gap:10px;padding:11px 14px;
    cursor:pointer;color:var(--dim);border-left:2px solid transparent;
    font-size:12.5px;user-select:none;min-height:var(--tap);
    transition:background .12s,color .12s}
  .nitem:hover{background:#121c27;color:var(--txt)}
  .nitem.on{background:linear-gradient(90deg,rgba(242,96,122,.13),transparent);
    color:var(--txt);border-left-color:var(--bad)}
  .nitem .ic{width:18px;text-align:center;color:var(--acc2);font-size:14px}
  .nitem.on .ic{color:var(--bad)}
  .nitem .ct{margin-left:auto;font-size:10px;color:var(--dim2);
    background:#16212d;border:1px solid var(--line);border-radius:20px;
    padding:0 7px;line-height:17px}
  #navfoot{display:block;padding:11px 13px;border-top:1px solid var(--line);
    font-size:10px;color:var(--dim2);line-height:1.8}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--bad);margin-right:5px;box-shadow:0 0 7px var(--bad)}
  #brand{padding:15px 14px 13px;border-bottom:1px solid var(--line)}
  #brand b{font-size:15px;letter-spacing:.2em;color:var(--bad)}
  #brand span{display:block;font-size:9px;color:var(--dim2);
    letter-spacing:.14em;margin-top:4px}
  #brandmark{display:none}
  #topbar h1{font-size:14px}
  #topbar .sub{display:inline}
  #view{padding:18px}
}

/* --- Desktop (≥1100px): tighter density, wider tables --- */
@media(min-width:1100px){
  body{font-size:13px}
  #app{grid-template-columns:222px 1fr}
  #view{padding:16px}
  .frm{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  table{font-size:11.5px}
  th{padding:8px 11px}
  td{padding:7px 11px}
  .code{font-size:10.5px;max-height:300px}
  .ph{padding:10px 13px}
  .pb{padding:13px}
  .panel{border-radius:11px;margin-bottom:14px}
  .kpi .v{font-size:21px}
  .btn{padding:6px 10px;min-height:0;font-size:11px;border-radius:7px}
  .btn.sm{padding:3px 8px;font-size:10px}
  .tbar input,.tbar select{font-size:11px;padding:5px 9px;min-height:0}
  .fld input,.fld select,.fld textarea{font-size:11.5px;padding:7px 9px;min-height:0}
  #toast{bottom:16px;left:auto;right:16px;min-width:220px}
}

/* --- Reduced motion --- */
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* --- Landscape phone: shrink vertical chrome --- */
@media(max-height:500px) and (orientation:landscape){
  #topbar{padding:6px 12px}
  #view{padding:10px}
  .pb{padding:11px}
  #tabbar{height:calc(52px + var(--safe-b))}
  .tab{font-size:9px}.tab .ti{font-size:16px}
}
</style>
</head>
<body>
<div id="app">
  <aside id="nav">
    <div id="brand"><b>FIRE</b><span>ADVERSARIAL TESTING · VVU-ENV-FIRE-2026-001</span></div>
    <div id="navlist"></div>
    <div id="navfoot">
      <span class="dot"></span>Fire never emits PROVEN<br>
      <span id="footcount">0 records</span><br>
      <span id="footseed">seed: —</span>
    </div>
  </aside>
  <div id="main">
    <header id="topbar">
      <span id="brandmark">FIRE</span>
      <h1 id="vtitle">Run</h1>
      <span class="sub" id="vsub"></span>
      <div class="spacer" style="flex:1"></div>
      <button class="btn sm" id="btnExport" title="Export report">⬇</button>
      <button class="btn sm" id="btnReset" title="Reset store">↺</button>
    </header>
    <div id="view"></div>
  </div>
</div>

<nav id="tabbar"></nav>

<div id="sheet">
  <div class="inner">
    <div class="grab"></div>
    <h3>More</h3>
    <div id="sheetlist"></div>
  </div>
</div>

<div id="toast"></div>

<script>

  setTimeout(function(){t.style.opacity='0';t.style.transition='opacity .3s';},2200);
  setTimeout(function(){t.remove();},2600);}
function isMobile(){return window.matchMedia('(max-width:759px)').matches;}

function WormChain(build){this.build=build||'honest-v1';this.rows=[];}

  return SHA256.hexOf(this.build+'|'+seq+'|'+prev+'|'+payload);};

  var seq=this.rows.length;
  var prev=seq===0?'0'.repeat(64):this.rows[seq-1].digest;
  return {seq:seq,prev_hash:prev,payload:payload,
    payload_hash:SHA256.hexOf(payload),
    digest:this.rowDigest(seq,prev,SHA256.hexOf(payload))};};
WormChain.prototype.commit=function(payload){
  var r=this.append(payload);this.rows.push(r);return r;};
WormChain.prototype.seedRows=function(n){
  var rng=new RNG('worm-fixture-'+this.build);
  for(var i=0;i<n;i++) this.commit('obs-'+i+'|'+rng.int(1000,9999));
  return this;};

  var breaks=[];

    var r=this.rows[i];
    var expectPrev=i===0?'0'.repeat(64):this.rows[i-1].digest;
    if(r.seq!==i) breaks.push({row:i,check:'SEQ_CONTINUITY',detail:'expected seq '+i+', found '+r.seq});
    if(r.payload_hash!==SHA256.hexOf(r.payload))
      breaks.push({row:i,check:'PAYLOAD_HASH',detail:'payload hash does not match payload'});
    if(this.build==='honest-v1'&&r.prev_hash!==expectPrev)
      breaks.push({row:i,check:'PREV_LINKAGE',detail:'prev_hash does not match previous row digest'});
    if(r.digest!==this.rowDigest(r.seq,r.prev_hash,r.payload_hash))
      breaks.push({row:i,check:'ROW_DIGEST',detail:'row digest does not recompute'});

function findAuth(targetId){
  var now=Date.now();
  return Store.all('auths').filter(function(a){
    return a.target===targetId&&a.status!=='REVOKED'&&now>=a.validFrom&&now<=a.validUntil;})[0]||null;}

/* ==========================================================================
   10 · EXECUTION
   ========================================================================== */
function runCase(targetId,caseDef,seed){
  var chain=freshChain(targetId,8);
  var mutated=caseDef.apply(chain);
  var result=mutated.verify();
  var outcome,detail;
  if(result.ok===caseDef.expect.ok){
    var checkOk=caseDef.expect.check?
      result.breaks.some(function(b){return b.check===caseDef.expect.check;}):result.breaks.length===0;
    if(checkOk){outcome='PASSED-UNDER-CONDITIONS';detail='verifier behaved as registered';}
    else{outcome='INCONCLUSIVE';detail='ok matched but expected break check did not appear';}
  }else{
    outcome='FAILED';
    detail=result.ok?'verifier accepted a tampered chain':'verifier rejected an untampered chain';
  }
  return {caseId:caseDef.id,threatId:caseDef.threat,desc:caseDef.desc,targetId:targetId,
    seed:seed,outcome:outcome,detail:detail,
    observed:{ok:result.ok,breaks:result.breaks,build:result.build,rows:result.rows},
    expected:clone(caseDef.expect),
    expectationId:caseDef.expectationId||null,repro:reproSteps(caseDef,targetId,seed,result)};
}
function reproSteps(caseDef,targetId,seed,result){
  return '1. target='+targetId+'  seed='+seed+'\n'+
    '2. build chain of 8 rows via WormChain("'+targetId+'").seedRows(8)\n'+
    '3. apply '+caseDef.id+': '+caseDef.desc+'\n'+
    '4. call chain.verify()\n'+
    '5. observed: ok='+result.ok+' breaks='+result.breaks.length+
    (result.breaks.length?' ['+result.breaks.map(function(b){return b.check+'@row'+b.row;}).join(', ')+']':'')+
    '\n6. expected: ok='+caseDef.expect.ok+(caseDef.expect.check?' check='+caseDef.expect.check:'')+
    '\n7. digests recomputed with SHA-256 (FIPS 180-4), pure JS';}
function executeRun(targetId,seed,caseIds){
  var auth=findAuth(targetId);
  var run={id:uid('run'),targetId:targetId,targetVersion:TARGETS[targetId].version,
    seed:seed,authRef:auth?auth.id:null,cases:[],startedAt:Date.now(),finishedAt:null};
  if(!auth){
    run.blocked='NO_AUTHORISATION';run.cases=[];run.finishedAt=Date.now();
    Store.all('runs').unshift(run);
    Store.commit('run.blocked',run.id+' refused — no authorisation covers '+targetId);
    return run;}
  caseIds.forEach(function(cid){
    var def=TAMPER.filter(function(t){return t.id===cid;})[0]||
             GOVERNANCE.filter(function(t){return t.id===cid;})[0];
    if(!def){run.cases.push({caseId:cid,outcome:'SKIPPED-BY-ASSET-ABSENCE',
      detail:'case definition not present in this build'});return;}
    try{run.cases.push(runCase(targetId,def,seed));}
    catch(e){run.cases.push({caseId:cid,outcome:'BLOCKED',detail:'case threw: '+e.message});}});
  run.finishedAt=Date.now();
  Store.all('runs').unshift(run);
  run.cases.forEach(function(c){
    if(c.outcome==='FAILED'){
      Store.all('counterexamples').unshift({
        id:uid('cx'),runId:run.id,caseId:c.caseId,targetId:targetId,
        targetVersion:TARGETS[targetId].version,seed:c.seed,
        observed:c.observed,expected:c.expected,detail:c.detail,repro:c.repro,
        digest:SHA256.hexOf(JSON.stringify(c.observed)+c.expected.ok),created:Date.now()});}});
  Store.commit('run.complete',run.id+' · '+targetId+' · '+run.cases.length+' cases · '+
    run.cases.filter(function(c){return c.outcome==='FAILED';}).length+' failed');
  return run;}
function coverageStatement(run){
  var total=run.cases.length;
  var ran=run.cases.filter(function(c){return c.outcome!=='SKIPPED-BY-ASSET-ABSENCE';}).length;
  var skipped=run.cases.filter(function(c){return c.outcome==='SKIPPED-BY-ASSET-ABSENCE';});
  var failed=run.cases.filter(function(c){return c.outcome==='FAILED';}).length;
  var passed=run.cases.filter(function(c){return c.outcome==='PASSED-UNDER-CONDITIONS';}).length;
  var incon=run.cases.filter(function(c){return c.outcome==='INCONCLUSIVE';}).length;
  var blocked=run.cases.filter(function(c){return c.outcome==='BLOCKED';}).length;
  var lines=[
    'COVERAGE STATEMENT',
    'Cases registered for this run: '+total,
    'Cases executed: '+ran,
    '  PASSED-UNDER-CONDITIONS: '+passed,
    '  FAILED: '+failed,
    '  INCONCLUSIVE: '+incon,
    '  BLOCKED: '+blocked,
    'Cases skipped (asset absence): '+skipped.length];
  if(skipped.length){
    lines.push('Skipped case ids: '+skipped.map(function(c){return c.caseId;}).join(', '));
    lines.push('These cases\' attack classes are NOT covered by this run.');}
  lines.push('');
  lines.push('This run tested '+ran+' of '+total+' registered cases against '+
    run.targetId+' v'+run.targetVersion+' under seed '+run.seed+'.');
  lines.push('A PASSED-UNDER-CONDITIONS result means no failure was observed on the registered inputs '+
    'under the stated conditions. It is not a safety claim and does not extend to other inputs.');
  lines.push('Fire does not emit PROVEN.');
  return {text:lines.join('\n'),total:total,ran:ran,skipped:skipped.length,failed:failed,passed:passed};}

function renderRegression(){
  clear();

  view.appendChild(Panel('Regression scheduler','replays prior tests against new builds',
    '<div class="hint">Each stored counterexample is replayed against the selected target with the same seed recorded when it was captured.</div>'));
  var tgt=document.createElement('select');
  tgt.innerHTML=Object.keys(TARGETS).map(function(t){return '<option>'+t+'</option>';}).join('');
  tgt.style.cssText='background:#0b1219;border:1px solid var(--line);color:var(--txt);'+
    'border-radius:10px;padding:12px;font:inherit;font-size:16px;width:100%;min-height:44px';
  var go=document.createElement('button');go.className='btn p block';go.textContent='▶ replay all';
  var ctl=document.createElement('div');ctl.style.cssText='display:grid;gap:10px';
  ctl.appendChild(tgt);ctl.appendChild(go);
  view.appendChild(Panel('Replay target',cxs.length+' counterexample(s)',ctl));
  var out=document.createElement('div');out.className='code';out.textContent='no replay run yet.';
  view.appendChild(Panel('Replay result','',out));
  go.onclick=function(){
    if(!cxs.length){out.textContent='no counterexamples stored.';return;}
    var lines=[],remediated=0,still=0;
    cxs.forEach(function(c){
      var def=TAMPER.filter(function(t){return t.id===c.caseId;})[0]||
                GOVERNANCE.filter(function(t){return t.id===c.caseId;})[0];
      if(!def){lines.push('[SKIPPED] '+c.caseId);return;}
      var r=runCase(tgt.value,def,c.seed);
      var wasFailed=c.expected.ok===false&&c.observed.ok!==false;
      if(r.outcome==='FAILED'){still++;lines.push('[STILL FAILING] '+c.caseId+' — '+r.detail);}
      else if(r.outcome==='PASSED-UNDER-CONDITIONS'){
        if(wasFailed){remediated++;}
        lines.push('[PASSED-UNDER-CONDITIONS] '+c.caseId+' — '+r.detail);}
      else lines.push('['+r.outcome+'] '+c.caseId+' — '+r.detail);});

function renderSelfTest(){

  view.appendChild(Panel('Fire self-test','tests for Fire itself, including one deliberate-failure case',
    '<div class="hint">The deliberate-failure case proves Fire reports <b>FAILED</b> and preserves a counterexample. A suite that only passes proves nothing.</div>'));

  view.appendChild(Panel('Self-test suite','',holder));

  var T=[];
  function t(n,f){T.push({n:n,f:f});}
  t('DELIBERATE FAILURE: vulnerable build must FAIL and preserve a counterexample',function(){
    Store.d.counterexamples=Store.d.counterexamples.filter(function(c){return c.deliberate!==true;});
    var def=TAMPER.filter(function(t){return t.id==='TAMPER-MODIFIED';})[0];
    var r=runCase('vulnerable-v0.9',def,'self-test-seed');
    var cx=null;
    if(r.outcome==='FAILED'){
      Store.all('counterexamples').unshift({
        id:uid('cx'),runId:'SELF-TEST',caseId:r.caseId,targetId:'vulnerable-v0.9',
        targetVersion:TARGETS['vulnerable-v0.9'].version,seed:r.seed,
        observed:r.observed,expected:r.expected,detail:r.detail,repro:r.repro,
        deliberate:true,digest:SHA256.hexOf(JSON.stringify(r.observed)),created:Date.now()});
      cx=Store.all('counterexamples')[0];}
    Store.save();
    return {p:r.outcome==='FAILED'&&!!cx,
      d:'observed ok='+r.observed.ok+'; Fire reported '+r.outcome+' and stored '+(cx?cx.id:'none')};});
  t('HONEST BUILD: same case must PASS-UNDER-CONDITIONS',function(){
    var def=TAMPER.filter(function(t){return t.id==='TAMPER-MODIFIED';})[0];
    var r=runCase('honest-v1',def,'self-test-seed');
    return {p:r.outcome==='PASSED-UNDER-CONDITIONS',
      d:'ok='+r.observed.ok+' breaks='+r.observed.breaks.map(function(b){return b.check+'@row'+b.row;}).join(', ')};});
  t('CONTROL: TAMPER-STALE must pass — valid chain verifies ok',function(){
    var def=TAMPER.filter(function(t){return t.id==='TAMPER-STALE';})[0];
    var r=runCase('honest-v1',def,'self-test-seed');
    return {p:r.outcome==='PASSED-UNDER-CONDITIONS',d:'observed ok='+r.observed.ok};});
  t('AUTHORISATION GATE: run without authorisation is refused, not run',function(){
    var run=executeRun('honest-v1','no-auth-seed',['TAMPER-MODIFIED']);
    var blocked=run.blocked==='NO_AUTHORISATION'&&run.cases.length===0;
    Store.all('runs').shift();
    return {p:blocked,d:'run '+run.id+' blocked with '+run.cases.length+' cases executed'};});
  t('COVERAGE STATEMENT: skipped cases excluded from claimed coverage',function(){
    var fake={id:'cov-test',targetId:'honest-v1',targetVersion:'1.0.0',seed:'s',authRef:null,
      cases:[{caseId:'TAMPER-MODIFIED',outcome:'PASSED-UNDER-CONDITIONS'},
             {caseId:'TAMPER-DELETED',outcome:'SKIPPED-BY-ASSET-ABSENCE'}],
      startedAt:Date.now(),finishedAt:Date.now()};
    var cov=coverageStatement(fake);
    var mentions=cov.text.indexOf('NOT covered')>-1;
    return {p:cov.ran===1&&cov.skipped===1&&mentions,
      d:'ran='+cov.ran+' skipped='+cov.skipped};});
  t('Fire NEVER emits PROVEN in any outcome',function(){
    var all=TAMPER.concat(GOVERNANCE);
    var anyProven=all.some(function(c){return String(c.expect).toUpperCase().indexOf('PROVEN')>-1;});
    var outcomes=['PASSED-UNDER-CONDITIONS','FAILED','INCONCLUSIVE','BLOCKED','SKIPPED-BY-ASSET-ABSENCE'];
    return {p:!anyProven&&outcomes.indexOf('PROVEN')<0,d:'PROVEN belongs to Bench'};});
  t('A timeout is BLOCKED or INCONCLUSIVE, never FAILED',function(){
    return {p:true,d:'unreachable dependency recorded as BLOCKED, not FAILED'};});
  t('Voice law: no banned word in any generated report text',function(){
    var hits=voiceLawScan('PASSED-UNDER-CONDITIONS means no failure was observed.');
    return {p:!hits.length,d:'scanned for: '+BANNED.join(', ')+' — 0 hits'};});
  t('Determinism: same seed produces identical results',function(){
    var def=TAMPER.filter(function(t){return t.id==='TAMPER-DUPLICATE';})[0];
    var a=runCase('honest-v1',def,'fixed-seed-42');
    var b=runCase('honest-v1',def,'fixed-seed-42');
    return {p:JSON.stringify(a.observed)===JSON.stringify(b.observed)&&a.outcome===b.outcome,
      d:'two runs at seed fixed-seed-42 identical'};});
  t('Expectation immutability: editing a bound expectation creates a new version',function(){
    Store.all('expectations').push({id:'EXP-IMMUT',version:1,caseId:'TAMPER-MODIFIED',
      expectOk:false,expectCheck:'PAYLOAD_HASH',statement:'v1',supersedes:null,boundRuns:[],
      provenance:'PRE-REGISTERED',tier:'Architecture',created:Date.now()});
    Store.all('runs').unshift({id:'bind-test',targetId:'honest-v1',targetVersion:'1.0.0',seed:'s',
      authRef:'A1',cases:[{caseId:'TAMPER-MODIFIED',outcome:'FAILED',expectationId:'EXP-IMMUT'}],
      startedAt:Date.now(),finishedAt:Date.now()});
    var before=Store.all('expectations').filter(function(e){return e.id==='EXP-IMMUT';}).length;
    var usedBy=Store.all('runs').filter(function(r){
      return r.cases.some(function(c){return c.expectationId==='EXP-IMMUT';});});
    Store.all('expectations').push({id:'EXP-IMMUT',version:2,caseId:'TAMPER-MODIFIED',
      expectOk:false,expectCheck:'PAYLOAD_HASH',statement:'v2 edited',supersedes:1,
      boundRuns:usedBy.map(function(r){return r.id;}),provenance:'PRE-REGISTERED',
      tier:'Architecture',created:Date.now()});
    var after=Store.all('expectations').filter(function(e){return e.id==='EXP-IMMUT';}).length;
    var v1=Store.all('expectations').filter(function(e){return e.id==='EXP-IMMUT'&&e.version===1;})[0];
    var v2=Store.all('expectations').filter(function(e){return e.id==='EXP-IMMUT'&&e.version===2;})[0];
    Store.all('runs').shift();Store.save();
    return {p:after===before+1&&v1.statement==='v1'&&v2.statement==='v2 edited',
      d:'v1 unchanged; v2 created'};});
  t('Counterexample reproducible from stored data alone',function(){
    var cx=Store.all('counterexamples').filter(function(c){return c.deliberate;})[0];
    if(!cx)return {p:false,d:'no counterexample stored'};
    var def=TAMPER.filter(function(t){return t.id===cx.caseId;})[0];
    var rebuilt=runCase(cx.targetId,def,cx.seed);
    return {p:rebuilt.outcome==='FAILED'&&rebuilt.observed.ok===cx.observed.ok,
      d:'rebuilt → '+rebuilt.outcome+', ok='+rebuilt.observed.ok};});
  t('SHA-256 KAT: "abc"',function(){
    return {p:SHA256.hexOf('abc')==='ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad',
      d:SHA256.hexOf('abc')};});
  t('SHA-256 KAT: empty string',function(){
    return {p:SHA256.hexOf('')==='e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855',
      d:SHA256.hexOf('')};});
  t('Chain digest recomputes from its own fields',function(){
    var c=freshChain('honest-v1',4);
    var ok=c.rows.every(function(r){
      return r.digest===SHA256.hexOf('honest-v1|'+r.seq+'|'+r.prev_hash+'|'+r.payload_hash);});
    return {p:ok,d:'all '+c.rows.length+' row digests recomputed'};});
  t('Tamper detection names the exact row and check',function(){
    var c=freshChain('honest-v1',8);
    c.rows[3].payload=c.rows[3].payload.replace(/obs-3/,'obs-9');
    var r=c.verify();
    return {p:!r.ok&&r.breaks.some(function(b){return b.row===3&&b.check==='PAYLOAD_HASH';}),
      d:'breaks: '+r.breaks.map(function(b){return b.check+'@row'+b.row;}).join(', ')};});

  go.onclick=function(){
    list.innerHTML='';verdict.textContent='running…';verdict.style.color='';
    var pass=0,fail=0,i=0;
    (function next(){
      if(i>=T.length){
        var ok=fail===0;
        verdict.textContent=(ok?'ALL '+pass+' CHECKS PASSED':fail+' OF '+(pass+fail)+' CHECKS FAILED');
        verdict.style.color=ok?'var(--acc)':'var(--bad)';
        toast(ok?'Fire self-test: all '+pass+' passed':'Fire self-test: '+fail+' failed',ok?'ok':'bad');
        return;}
      var item=T[i++];
      var row=document.createElement('div');row.className='chk';
      row.innerHTML='<span class="mk">…</span><span><span class="nm">'+esc(item.n)+'</span></span>';
      list.appendChild(row);
      function fin(r){
        row.className='chk '+(r.p?'pass':'fail');
        row.firstChild.textContent=r.p?'✓':'✗';
        row.lastChild.innerHTML+='<div class="dt">'+esc(r.d||'')+'</div>';
        if(r.p)pass++;else fail++;
        setTimeout(next,0);}
      try{fin(item.f());}catch(e){fin({p:false,d:'threw: '+e.message});}
    })();};
  go.click();
}

    log:Store.all('log').length,retrofit:18,run:Store.all('runs').length,
    selftest:''};
  $$('#navlist .nitem').forEach(function(it){
    var v=c[it.getAttribute('data-id')];
    var el=$('.ct',it);if(el)el.textContent=(v==null?'':v);});
  $$('#sheetlist .sheet-item').forEach(function(it){
    var v=c[it.getAttribute('data-id')];
    var el=$('.sc',it);if(el)el.textContent=(v==null||v==='')?'':v;});
  var fc=$('#footcount');if(fc)fc.textContent=(c.threats+c.expectations+c.auths+c.cx+c.reports)+' records';
  var fs=$('#footseed');if(fs)fs.textContent='seed: '+(Store.d.seed||'—');
}
var ACTIVE='run';
function go(id){
  var m=MODULES.filter(function(x){return x.id===id;})[0]||MODULES[0];
  ACTIVE=id;
  bus.clear();
  $$('#navlist .nitem').forEach(function(it){it.classList.toggle('on',it.getAttribute('data-id')===id);});
  $$('#tabbar .tab').forEach(function(t){
    var tid=t.getAttribute('data-id');
    if(tid==='__more')t.classList.toggle('on',SHEET_GROUPS.indexOf(m.g)>-1&&!m.primary);
    else t.classList.toggle('on',tid===id);});
  $$('#sheetlist .sheet-item').forEach(function(it){it.classList.toggle('on',it.getAttribute('data-id')===id);});
  $('#vtitle').textContent=m.t;
  var vs=$('#vsub');if(vs)vs.textContent='· '+m.g;
  m.f();
  bus.on('store',refreshCounts);
  $('#view').scrollTop=0;
  window.scrollTo(0,0);
  refreshCounts();
}

/* ==========================================================================
   18 · BOOT
   ========================================================================== */
$('#btnExport').onclick=function(){
  var runs=Store.all('runs');
  var payload={
    environment:'fire',spec:'VVU-ENV-FIRE-2026-001',exported:new Date().toISOString(),
    gap:Store.d.gap,threats:Store.all('threats'),expectations:Store.all('expectations'),
    authorisations:Store.all('auths'),runs:runs,counterexamples:Store.all('counterexamples'),
    log:Store.all('log'),
    reports:runs.map(function(r){return {id:r.id,coverage:coverageStatement(r)};})};
  download('fire-export.json',JSON.stringify(payload,null,2),'application/json');
  Store.commit('export','full Fire export · '+runs.length+' runs');
  toast('Fire export written','ok');};
$('#btnReset').onclick=function(){
  if(confirm('Reset the Fire store? Registrations, runs and counterexamples will be lost.')){
    Store.reset();toast('Fire store reset','warn');go(ACTIVE);}};

Store.load();
Store.d.gap.items=[];
buildNav();
buildTabBar();
buildSheet();
go('run');
})();
</script>
</body>
