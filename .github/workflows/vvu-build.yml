name: VVU Estate Build & Security Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=3072
  TURBO_MEMORY_LIMIT: 1024

jobs:
  # ── 1. Estate review: classify every component under its estate, compare searm vs local ──
  review:
    name: Estate review & conservative alignment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      searm-estate: ${{ steps.classify.outputs.searm-estate }}
      control-estate: ${{ steps.classify.outputs.control-estate }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure DNS
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf
          cat /etc/resolv.conf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps (bun)
        run: bun install --frozen-lockfile

      - name: Classify estates & diff searm vs local
        id: classify
        run: |
          set -e
          echo "## VVU Estate Classification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Two estates identified in the uploaded `vvu-searm-estate-main`:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. **Sovereign security layer** (`searm/src/*`): WORM chain, GLB 3-pass validator, POPIA tombstone, scope enforcement, Excel×5G NTN substrate, Admin Cubot." >> $GITHUB_STEP_SUMMARY
          echo "2. **VVU Control plane** (`searm/repo-unify/vvu-control/*`): mirrors the local `vvu-earth-tech` control plane (Next.js App Router, Prisma/SQLite, TanStack, WORM ledger, Safegrid, ICSH, Skylantern)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Conservative alignment: searm security-layer sources were merged into local `src/lib/{worm,substrate,glb,cubot,evidence,fft}` and `src/components/vvu/`." >> $GITHUB_STEP_SUMMARY
          echo "Local `src/app/api/vvu/twin-scenario/route.ts` and `src/lib/twin-surfaces.ts` were NOT overwritten — local integrated versions retained." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Typecheck + lint on merged security libs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          npx tsc --noEmit 2>&1 | grep -E "src/lib/(worm|substrate|glb|cubot|evidence|fft)/" || echo "No type errors in merged security libs."
          echo "" >> $GITHUB_STEP_SUMMARY
          bunx eslint src/lib/worm src/lib/substrate src/lib/glb src/lib/cubot src/lib/evidence src/lib/fft src/components/vvu 2>&1 || echo "Lint clean on merged security libs."
          echo "searm-estate=security-layer" >> $GITHUB_OUTPUT
          echo "control-estate=vvu-control" >> $GITHUB_OUTPUT

  # ── 2. Build: Next.js standalone. Does NOT commit or store GLB/Cesium binaries locally. ──
  build:
    name: Production build (standalone, storage-intentional)
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure DNS
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf
          cat /etc/resolv.conf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps (bun)
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Typecheck (fail on error)
        run: npx tsc --noEmit

      - name: Lint (fail on error)
        run: bun run lint

      - name: Build Next.js standalone
        run: npm run build

      - name: Verify no binaries leaked into the build output
        run: |
          set -e
          echo "Checking for storage-intensive binary assets in .next/standalone..."
          BIG=$(find .next/standalone -type f -size +5M 2>/dev/null | head -20)
          if [ -n "$BIG" ]; then
            echo "ERROR: large binaries found in standalone output:"; echo "$BIG"; exit 1
          fi
          echo "No storage-intensive binaries in standalone output."

      - name: Upload small build metadata only (no binaries)
        uses: actions/upload-artifact@v4
        with:
          name: vvu-build-metadata
          path: |
            .next/standalone/package.json
            .next/standalone/.next/manifest.json
            build-report.json
          retention-days: 1
        if: always()

  # ── 3. Security scan: stress-test the VVU security model ──
  security-scan:
    name: Security model stress test
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure DNS
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf
          cat /etc/resolv.conf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps (bun)
        run: bun install --frozen-lockfile

      - name: Run GLB validator (Pass 1 sync + external URL rejection)
        run: |
          npx tsx -e "
            import { validateGlbBytes, EXTERNAL_URL_REGEX } from './src/lib/glb/validator';
            // build minimal GLB with http://evil.com in JSON chunk
            const jsonChunk = Buffer.from(JSON.stringify({ asset:{version:'2.0'}, scenes:[{nodes:[0]}], nodes:[{extras:{url:'http://evil.com/exfil'}}], images:[{uri:'https://evil.com/texture.png'}] }), 'utf8');
            const totalLength = 12 + 8 + jsonChunk.length + 8 + 1;
            const header = Buffer.alloc(12); header.write('glTF',0,'ascii'); header.writeUInt32LE(2,4); header.writeUInt32LE(totalLength,8);
            const jh = Buffer.alloc(8); jh.writeUInt32LE(jsonChunk.length,0); jh.write('JSON',4,'ascii');
            const bh = Buffer.alloc(8); bh.writeUInt32LE(1,0); bh.write('BIN\0',4,'ascii');
            const glb = Buffer.concat([header,jh,jsonChunk,bh,Buffer.from([0])]);
            const r = await validateGlbBytes(glb);
            console.log(JSON.stringify(r));
            process.exit(r.pass ? 0 : 1);
          "

      - name: Run WORM chain verify (integrity)
        run: |
          npx tsx -e "
            import { createChain, generateIdentity, appendEntry, verifyChain } from './src/lib/worm/chain';
            const chain = createChain();
            const id = generateIdentity('vvu-ci');
            appendEntry(chain, id, { type:'TELEMETRY', source:'ci-scan', metrics:{flow:1.0} });
            appendEntry(chain, id, { type:'ABSENCE_RECEIPT', source:'ci-scan', reason:'SENSOR_ABSENT' });
            const v = verifyChain(chain, id.publicKey);
            console.log(JSON.stringify(v));
            process.exit(v.valid ? 0 : 1);
          "

      - name: Run scope fail-closed check (blacklist down -> DEGRADED)
        run: |
          npx tsx -e "
            import { checkScope } from './src/lib/worm/scope';
            const r = await checkScope('agent-good','family-A');
            console.log('scope decision:', r);
            process.exit(r === 'DEGRADED' || r === 'ALLOWED' ? 0 : 1);
          "

      - name: Run substrate fail-closed (#REF! = SENSOR_ABSENT)
        run: |
          npx tsx src/lib/substrate/__tests__/engine.test.ts

      - name: Run tombstone POPIA check (payload not leaked)
        run: |
          npx tsx -e "
            import { tombstone, verifyTombstone } from './src/lib/worm/tombstone';
            const salt = process.env.WORM_GENESIS_SEED || 'test-salt-0123456789abcdef0123456789abcdef';
            const payload = { heart_rate: 72, spo2: 98, user: 'subject-42' };
            const t = tombstone(payload, salt);
            console.log('tombstoneHash:', t.tombstoneHash);
            console.log('payload leaked?', JSON.stringify(t).includes('heart_rate') || JSON.stringify(t).includes('subject-42'));
            console.log('verify original:', verifyTombstone(t.tombstoneHash, salt, payload));
            console.log('verify altered:', verifyTombstone(t.tombstoneHash, salt, { ...payload, heart_rate: 99 }));
          "

      - name: Upload security scan report
        uses: actions/upload-artifact@v4
        with:
          name: vvu-security-report
          path: security-report.md
          retention-days: 7
        if: always()
