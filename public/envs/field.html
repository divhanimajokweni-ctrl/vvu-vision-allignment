<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIELD · Observation Environment</title>
<style>
:root{--bg:#0a0e13;--bg2:#0e141c;--panel:#111a24;--panel2:#0d151e;--line:#1c2836;--line2:#26374a;

--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--mono);font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden}
#app{display:grid;grid-template-columns:224px 1fr;height:100vh}
#nav{background:linear-gradient(180deg,#0d141d,#0a0f15);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
#brand{padding:14px 14px 12px;border-bottom:1px solid var(--line)}
#brand b{font-size:15px;letter-spacing:.2em;color:var(--warn)}
#brand span{display:block;font-size:9px;color:var(--dim2);letter-spacing:.14em;margin-top:4px}
#navlist{flex:1;overflow-y:auto;padding:8px 0}
.ngroup{font-size:9px;letter-spacing:.18em;color:var(--dim2);padding:12px 14px 5px;text-transform:uppercase}
.nitem{display:flex;align-items:center;gap:9px;padding:8px 14px;cursor:pointer;color:var(--dim);border-left:2px solid transparent;font-size:12px;user-select:none;min-height:34px}
.nitem:hover{background:#121c27;color:var(--txt)}
.nitem.on{background:linear-gradient(90deg,rgba(245,185,68,.13),transparent);color:var(--txt);border-left-color:var(--warn)}
.nitem .ic{width:16px;text-align:center;color:var(--acc2)}
.nitem.on .ic{color:var(--warn)}
.nitem .ct{margin-left:auto;font-size:10px;color:var(--dim2);background:#16212d;border:1px solid var(--line);border-radius:20px;padding:0 6px;line-height:16px}
#navfoot{padding:10px 12px;border-top:1px solid var(--line);font-size:9.5px;color:var(--dim2);line-height:1.7}
#main{display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap}
#topbar h1{font-size:13px;margin:0;font-weight:600;letter-spacing:.06em;white-space:nowrap}
#topbar .sub{font-size:10px;color:var(--dim2);letter-spacing:.1em}
.spacer{flex:1}
.btn{background:#16222e;border:1px solid var(--line);color:var(--dim);border-radius:7px;padding:6px 10px;font:inherit;font-size:11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--warn);color:var(--warn)}
.btn.p{background:rgba(245,185,68,.1);border-color:rgba(245,185,68,.4);color:var(--warn)}
.btn.sm{padding:3px 8px;font-size:10px}
.btn.ok{border-color:rgba(55,214,160,.4);color:var(--acc)}
.btn.ok:hover{border-color:var(--acc);color:var(--acc)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
#view{flex:1;overflow-y:auto;padding:16px}
.panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:11px;margin-bottom:14px;overflow:hidden}
.ph{display:flex;align-items:center;gap:9px;padding:10px 13px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph h2{margin:0;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--warn);font-weight:600}
.ph .hint{font-size:10px;color:var(--dim2)}
.pb{padding:13px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g21{grid-template-columns:2fr 1fr}

.kpi{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.kpi .l{font-size:9.5px;letter-spacing:.14em;color:var(--dim2);text-transform:uppercase}
.kpi .v{font-size:21px;margin-top:5px;line-height:1}
.kpi .d{font-size:10px;color:var(--dim);margin-top:4px}
.kpi.a .v{color:var(--acc)}.kpi.b .v{color:var(--acc2)}.kpi.w .v{color:var(--warn)}.kpi.r .v{color:var(--bad)}
.tbar{display:flex;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tbar input,.tbar select{background:#0b1219;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:5px 9px;font:inherit;font-size:11px;outline:none}
.tbar input{width:140px}
.tbar .cnt{font-size:10px;color:var(--dim2)}
.tbar .acts{margin-left:auto;display:flex;gap:6px}
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:left;padding:7px 11px;color:var(--dim2);font-weight:600;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--txt)}
th .ar{color:var(--warn);font-size:9px}
td{padding:7px 11px;border-bottom:1px solid #16202b;vertical-align:middle;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#141f2b}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:160px}
.mono{font-family:var(--mono);color:var(--dim);font-size:10.5px;word-break:break-all}
.b{display:inline-block;padding:1px 7px;border-radius:20px;font-size:9.5px;letter-spacing:.06em;border:1px solid}
.b.ok{color:var(--acc);border-color:rgba(55,214,160,.35);background:rgba(55,214,160,.09)}
.b.info{color:var(--acc2);border-color:rgba(58,169,245,.35);background:rgba(58,169,245,.09)}
.b.warn{color:var(--warn);border-color:rgba(245,185,68,.35);background:rgba(245,185,68,.09)}
.b.bad{color:var(--bad);border-color:rgba(242,96,122,.35);background:rgba(242,96,122,.09)}
.b.mut{color:var(--dim2);border-color:var(--line);background:#131c26}
.b.pur{color:var(--pur);border-color:rgba(167,139,250,.35);background:rgba(167,139,250,.09)}
.alist{display:flex;flex-direction:column}
.arow{display:flex;gap:9px;align-items:flex-start;padding:7px 12px;border-bottom:1px solid #16202b;font-size:11.5px}
.arow:last-child{border-bottom:0}
.arow .tm{color:var(--dim2);font-size:10px;white-space:nowrap;margin-left:auto;text-align:right}
.arow .sv{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:none}
.sv.ok{background:var(--acc);box-shadow:0 0 7px var(--acc)}
.sv.warn{background:var(--warn);box-shadow:0 0 7px var(--warn)}
.sv.info{background:var(--acc2);box-shadow:0 0 7px var(--acc2)}
.sv.crit{background:var(--bad);box-shadow:0 0 7px var(--bad)}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:9px;align-items:end}
.fld label{display:block;font-size:9.5px;letter-spacing:.12em;color:var(--dim2);text-transform:uppercase;margin-bottom:4px}
.fld input,.fld select{width:100%;background:#0b1219;border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:7px 9px;font:inherit;font-size:11.5px;outline:none}
.fld input:focus,.fld select:focus{border-color:var(--warn)}
.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:11.5px;align-items:center}
.kv dt{color:var(--dim2)}
.kv dd{margin:0;color:var(--txt);word-break:break-all}
.hint{font-size:10.5px;color:var(--dim2);line-height:1.75}
.code{background:#0a1017;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:10.5px;color:#9fd0e8;white-space:pre-wrap;word-break:break-all;line-height:1.6;max-height:330px;overflow:auto}
.chk{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid #16202b;font-size:11.5px}
.chk:last-child{border-bottom:0}
.chk .mk{width:15px;flex:none;font-weight:700}
.chk.pass .mk{color:var(--acc)}.chk.fail .mk{color:var(--bad)}
.chk .nm{color:var(--txt)}
.chk .dt{color:var(--dim2);font-size:10px;margin-top:2px;word-break:break-all}
.tag{display:inline-block;background:#16212d;border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-size:9.5px;color:var(--dim);margin:2px 3px 2px 0}
.tag.a{color:var(--acc);border-color:rgba(55,214,160,.35)}
.tag.b{color:var(--acc2);border-color:rgba(58,169,245,.35)}
.tag.w{color:var(--warn);border-color:rgba(245,185,68,.35)}
.tag.r{color:var(--bad);border-color:rgba(242,96,122,.35)}
.gap td{white-space:normal;padding:5px 7px}
.gap th{background:transparent;position:static;cursor:default}
.tl{display:flex;gap:2px;margin:10px 0}
.tl div{flex:1;text-align:center;padding:6px 2px;border:1px solid var(--line);border-radius:6px;font-size:9.5px;color:var(--dim2);background:#0d151e}
.tl div.on{color:var(--acc);border-color:var(--acc);background:rgba(55,214,160,.09)}
#toast{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:7px;z-index:99;pointer-events:none}
.tst{background:#121b26;border:1px solid var(--warn);border-left-width:3px;border-radius:8px;padding:9px 13px;font-size:11.5px;box-shadow:0 8px 26px rgba(0,0,0,.55);animation:tin .18s ease-out}
.tst.ok{border-color:var(--acc)}.tst.bad{border-color:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:#0a0f15}
::-webkit-scrollbar-thumb{background:#22323f;border-radius:6px;border:2px solid #0a0f15}
::-webkit-scrollbar-thumb:hover{background:#31465a}
</style>

<script>

function uid(p){return p+'-'+Math.random().toString(36).slice(2,10);}
function iso(ts){return new Date(ts).toISOString();}
function ago(ts){var s=Math.max(0,(Date.now()-ts)/1000);
  if(s<60)return Math.floor(s)+'s';if(s<3600)return Math.floor(s/60)+'m';
  if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d';}
function dur(ms){
  var h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000);
  return h+'h '+m+'m';}
function clone(o){return JSON.parse(JSON.stringify(o));}
function sum(a,f){return a.reduce(function(t,x){return t+(f?f(x):x);},0);}
function download(name,text,mime){
  var b=new Blob([text],{type:mime||'text/plain'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},400);}
function toast(msg,kind){
  var t=document.createElement('div');t.className='tst'+(kind?' '+kind:'');t.textContent=msg;
  $('#toast').appendChild(t);
  setTimeout(function(){t.style.opacity='0';t.style.transition='opacity .3s';},2200);
  setTimeout(function(){t.remove();},2600);}

/* ==========================================================================

var SHA256=(function(){

    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
  function rotr(x,n){return (x>>>n)|(x<<(32-n));}

    var l=bytes.length,hi=Math.floor(l/536870912),lo=(l*8)>>>0;
    var pad=((56-((l+1)%64))+64)%64,total=l+1+pad+8,m=new Uint8Array(total);
    m.set(bytes);m[l]=0x80;
    var p=total-8;
    m[p]=hi>>>24;m[p+1]=hi>>>16;m[p+2]=hi>>>8;m[p+3]=hi;
    m[p+4]=lo>>>24;m[p+5]=lo>>>16;m[p+6]=lo>>>8;m[p+7]=lo;
    var H=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);

      var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];

/* ==========================================================================
   OBSERVATION TYPE — observed only. Inference is a type Field cannot construct.
   ========================================================================== */
var OBS_FIELDS=['observation_id','value','unit','sensor_id','measured_at','received_at',
  'calibration_state','sensor_state','configuration_version','provenance','clock_source',
  'clock_confidence'];
function isObservation(o){
  if(!o||typeof o!=='object')return false;
  for(var i=0;i<OBS_FIELDS.length;i++) if(!(OBS_FIELDS[i] in o)) return false;
  if(o.provenance!=='DEVICE-OBSERVED'&&o.provenance!=='SYNTHETIC-ONLY')return false;
  if(['VALID','EXPIRED','UNKNOWN'].indexOf(o.calibration_state)<0)return false;
  if(['OK','FAULT','UNKNOWN'].indexOf(o.sensor_state)<0)return false;
  if('inference' in o||'conclusion' in o||'interpretation' in o)return false;
  return true;}
function isInference(o){
  return !!o&&typeof o==='object'&&('inference' in o||'conclusion' in o);}

var DELIVERY=['RECORDED_LOCALLY','QUEUED_FOR_EXPORT','TRANSMITTED',
  'ACCEPTED_BY_RECEIVER','VALIDATED_BY_RECEIVER'];
var TRANSITIONS={
  RECORDED_LOCALLY:['QUEUED_FOR_EXPORT'],
  QUEUED_FOR_EXPORT:['TRANSMITTED'],
  TRANSMITTED:['ACCEPTED_BY_RECEIVER'],
  ACCEPTED_BY_RECEIVER:['VALIDATED_BY_RECEIVER'],
  VALIDATED_BY_RECEIVER:[]};
function canTransition(from,to){
  return (TRANSITIONS[from]||[]).indexOf(to)>-1;}

/* ==========================================================================
   VIRTUAL CLOCK
   ========================================================================== */
function VClock(){this.t=Date.now();}
VClock.prototype.now=function(){return this.t;};
VClock.prototype.advance=function(ms){this.t+=ms;return this.t;};
VClock.prototype.set=function(ms){this.t=ms;return this.t;};

/* ==========================================================================
   STORE
   ========================================================================== */
var KEY='field.vvu.v1';
var Store={
  d:null,
  load:function(){
    try{var raw=localStorage.getItem(KEY);
      if(raw){var o=JSON.parse(raw);if(o&&o.queue){this.d=o;return;}}}catch(e){}
    this.d={queue:[],delivered:[],gaps:[],log:[],config:{version:'1.0.0'},
      sensors:[{id:'SNS-001',calibration:'VALID',state:'OK',unit:'L/s'},
               {id:'SNS-002',calibration:'VALID',state:'OK',unit:'kL'},
               {id:'SNS-003',calibration:'EXPIRED',state:'OK',unit:'bar'},
               {id:'SNS-004',calibration:'VALID',state:'FAULT',unit:'L/s'}],
      ackedIds:[]};
    this.commit('system','Field store initialised');},
  save:function(){try{localStorage.setItem(KEY,JSON.stringify(this.d));}catch(e){toast('persist failed','bad');}},
  commit:function(type,detail){
    this.d.log.unshift({t:Date.now(),type:type,detail:detail});
    if(this.d.log.length>200)this.d.log.length=200;
    this.save();bus.emit('store');},
  reset:function(){localStorage.removeItem(KEY);this.d={queue:[],delivered:[],gaps:[],log:[],
    config:{version:'1.0.0'},
    sensors:[{id:'SNS-001',calibration:'VALID',state:'OK',unit:'L/s'},
             {id:'SNS-002',calibration:'VALID',state:'OK',unit:'kL'},
             {id:'SNS-003',calibration:'EXPIRED',state:'OK',unit:'bar'},
             {id:'SNS-004',calibration:'VALID',state:'FAULT',unit:'L/s'}],
    ackedIds:[]};
    this.commit('system','Field store reset');},
  all:function(k){return this.d[k]||[];}};
var bus={fns:{},on:function(e,f){(this.fns[e]=this.fns[e]||[]).push(f);return f;},
  clear:function(){this.fns={};},
  emit:function(e){(this.fns[e]||[]).forEach(function(f){try{f();}catch(err){console.error(err);}});}};

function capture(vc,sensor,value,opts){
  opts=opts||{};
  var measured=opts.measuredAt||vc.now();
  var o={
    observation_id:opts.id||uid('obs'),
    value:value,
    unit:sensor.unit,
    sensor_id:sensor.id,
    measured_at:measured,
    received_at:vc.now(),
    calibration_state:sensor.calibration,
    sensor_state:opts.sensorState||sensor.state,
    configuration_version:Store.d.config.version,
    provenance:opts.provenance||'SYNTHETIC-ONLY',
    clock_source:opts.clockSource||'VIRTUAL',
    clock_confidence:opts.clockConfidence||'HIGH'
  };
  if(!isObservation(o))throw new Error('captured object is not a valid observation');
  Store.d.queue.push(o);
  return o;}

/* ==========================================================================

   ========================================================================== */
var GAPS=[
  {id:'D1',name:'FIELD OS · CARD.html (capture card, offline queue, signature)',path:'(no path supplied)',

function Table(cols,rows,opts){
  opts=opts||{};

  var tb=document.createElement('div');tb.className='tbar';

    hr.appendChild(th);});
  thead.appendChild(hr);table.appendChild(thead);
  var tbody=document.createElement('tbody');table.appendChild(tbody);
  tw.appendChild(table);
  wrap.appendChild(tb);wrap.appendChild(tw);
  function vis(){
    var r=rows.filter(function(r){
      if(!st.q)return true;
      return cols.some(function(c){return String(r[c.k]).toLowerCase().indexOf(st.q)>-1;});});
    var c=cols[st.sort];
    r.sort(function(a,b){
      var x=a[c.k],y=b[c.k];
      if(typeof x==='number'&&typeof y==='number')return (x-y)*st.dir;
      return String(x).localeCompare(String(y))*st.dir;});

  function exp(k){

    else{
      var head=cols.map(function(c){return c.l;}).join(',');
      var body=data.map(function(r){return cols.map(function(c){
        var v=r[c.k];return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}).join(',');}).join('\n');

        if(c.badge)td.innerHTML=badge(v);

        else td.innerHTML=esc(v);
        tr.appendChild(td);});
      tbody.appendChild(tr);});
    if(!r.length){var e=document.createElement('tr'),td=document.createElement('td');
      td.colSpan=cols.length;td.className='hint';td.style.padding='16px';td.style.textAlign='center';
      td.textContent='no records';e.appendChild(td);tbody.appendChild(e);}}
  paint();return wrap;}

function syncOnce(){
  var q=Store.d.queue;
  if(!q.length){toast('queue empty — nothing to sync','warn');return;}
  var first=q[0];
  var lastDelivered=Store.d.delivered.length?Store.d.delivered[Store.d.delivered.length-1].received_at:first.measured_at;
  if(q[0].measured_at-lastDelivered>60000){
    Store.d.gaps.unshift({from:lastDelivered,to:q[0].measured_at,
      duration:q[0].measured_at-lastDelivered,observations_queued:q.length,
      reason:'device offline — no connectivity during this interval',recorded_at:Date.now()});}
  var acked=0,validated=0;
  q.forEach(function(o){
    if(Store.d.ackedIds.indexOf(o.observation_id)>-1)return;
    o.delivery_status='TRANSMITTED';
    o.transmitted_at=Date.now();
    Store.d.ackedIds.push(o.observation_id);
    o.acked_by='receiver-'+o.observation_id.slice(-6);
    o.delivery_status='ACCEPTED_BY_RECEIVER';
    o.validation_ref='vr-'+o.observation_id.slice(-8);
    o.delivery_status='VALIDATED_BY_RECEIVER';
    o.validated_at=Date.now();
    Store.d.delivered.push(o);acked++;validated++;});
  Store.d.queue=[];
  Store.commit('sync','transmitted '+acked+' · acked '+acked+' · validated '+validated+
    ' · duplicates collapsed · gaps recorded '+Store.d.gaps.length);
  toast('sync complete · '+acked+' observations · VALIDATED_BY_RECEIVER','ok');
  renderQueue();
}

  run.onclick=function(){

      (Store.d.queue.length===lenBefore)?ok('FS-2 receiver unavailable',
        'receiver refused; queue length unchanged at '+lenBefore+'; zero observations dropped'):
        no('FS-2 receiver unavailable','queue changed');}
    var snap=clone(Store.d.queue);
    var firstLen=snap.length;
    var firstDelivered=Store.d.delivered.length;
    syncOnce();
    var afterFirst=Store.d.delivered.length-firstDelivered;
    var queueAfterFirst=Store.d.queue.length;
    var ids=Store.d.delivered.map(function(o){return o.observation_id;});
    var dup=ids.length!==new Set(ids).size;
    syncOnce();
    var secondAdded=Store.d.delivered.length-firstDelivered-afterFirst;
    (afterFirst===firstLen&&!dup&&secondAdded===0&&queueAfterFirst===0)?
      ok('FS-3 recovery',
        'first sync delivered '+afterFirst+' of '+firstLen+'; second sync added '+secondAdded+
        ' (duplicates collapsed by observation_id); no prior observation overwritten'):
      no('FS-3 recovery','first='+afterFirst+'/'+firstLen+' dup='+dup+' second='+secondAdded);
    var pkg={package_version:'1.0',
      manifest:{observation_count:snap.length,
        observations:snap.map(function(o){return {observation_id:o.observation_id};})},
      observations:snap};
    var idsMatch=pkg.observations.every(function(o){
      return pkg.manifest.observations.some(function(m){return m.observation_id===o.observation_id;});});
    var countMatch=pkg.manifest.observation_count===pkg.observations.length;
    (idsMatch&&countMatch)?ok('FS-4 handoff',
      'self-contained package built with no service online; manifest count '+pkg.manifest.observation_count+
      ' equals observation count '+pkg.observations.length+'; every id present in the manifest'):
      no('FS-4 handoff','manifest mismatch');
    var faultSensor=Store.d.sensors.filter(function(s){return s.state==='FAULT';})[0];
    var expSensor=Store.d.sensors.filter(function(s){return s.calibration==='EXPIRED';})[0];
    var fo=capture(vc,faultSensor,99.9);
    var eo=capture(vc,expSensor,88.8);
    (isObservation(fo)&&isObservation(eo)&&fo.sensor_state==='FAULT'&&eo.calibration_state==='EXPIRED'&&
     fo.value===99.9&&eo.value===88.8)?
      ok('FS-5 sensor FAULT / calibration expired',
        'both observations recorded, neither dropped nor corrected. FAULT sensor value 99.9 carries sensor_state FAULT; '+
        'EXPIRED calibration value 88.8 carries calibration_state EXPIRED'):
      no('FS-5','observation dropped or silently corrected');
    Store.d.queue=snap;
    Store.commit('semantics.test','five failure semantics executed');
    out.textContent=L.join('\n\n')+'\n\n'+
      'All five semantics executed. FS-1..FS-4 are availability semantics; FS-5 is a data-quality semantic. '+
      'They are reported separately because they answer different questions.';
    toast('five failure semantics executed',L.every(function(l){return l.indexOf('[PASS]')===0;})?'ok':'bad');};
}

/* ==========================================================================
   72-HOUR DISCONNECTION TEST
   ========================================================================== */
function render72h(){
  clear();
  view.appendChild(Panel('72-hour disconnection test','synthetic clock-driven · provenance SYNTHETIC-ONLY',
    '<div class="hint">A virtual clock runs a device through 72 hours with no connectivity. Observations are '+
    'captured every 15 minutes (288 expected). Connectivity then returns and the queue is delivered. '+
    'The test asserts original timestamps survive, no duplicates appear, and a gap fact is emitted. '+
    'Live-device confirmation of this remains the operator\'s gate.</div>'));
  var ctl=document.createElement('div');ctl.className='row';
  var run=document.createElement('button');run.className='btn p';run.textContent='▶ run 72-hour disconnection test';
  ctl.appendChild(run);
  view.appendChild(Panel('Execute','',ctl));
  var out=document.createElement('div');out.className='code';
  out.textContent='not run yet.';
  view.appendChild(Panel('Result','',out));
  var tl=document.createElement('div');tl.className='tl';
  ['T0 offline','+24h','+48h','+72h reconnect','delivered','gap fact'].forEach(function(s,i){
    tl.innerHTML+='<div data-i="'+i+'">'+s+'</div>';});
  view.appendChild(Panel('Timeline','',tl));

  run.onclick=function(){
    var L=[];
    function ok(n,d){L.push('[PASS] '+n+'\n       '+d);}
    function no(n,d){L.push('[FAIL] '+n+'\n       '+d);}
    var vc=new VClock();vc.set(1735689600000);
    var T0=vc.now();
    var sensor={id:'SNS-001',unit:'L/s',calibration:'VALID',state:'OK'};
    var HOURS=72,INTERVAL=15*60*1000;
    var expected=HOURS*60/15;
    var captured=[];
    var cfgBefore=Store.d.config.version;
    for(var i=0;i<expected;i++){
      var o=capture(vc,sensor,+(18+Math.sin(i/9)*4+(i%7)*0.1).toFixed(2),
        {measuredAt:vc.now(),clockSource:'VIRTUAL',clockConfidence:'HIGH'});
      captured.push(o);
      vc.advance(INTERVAL);}
    var T72=vc.now();
    var faultObs=capture(vc,{id:'SNS-004',unit:'L/s',calibration:'VALID',state:'FAULT'},0,
      {measuredAt:T0+36*3600000});
    captured.push(faultObs);
    var queueLen=Store.d.queue.length;
    (queueLen===captured.length)?ok('offline capture',
      expected+' observations captured over 72 virtual hours at 15-minute intervals, plus 1 fault observation = '+
      queueLen+' queued. Device remained offline throughout.'):
      no('offline capture','expected '+captured.length+', queued '+queueLen);
    var allOriginal=captured.every(function(o,idx){
      return o.measured_at===T0+idx*INTERVAL || o===faultObs;});
    (allOriginal)?ok('original timestamps preserved',
      'first measured_at '+iso(T0)+' · last measured_at '+iso(T0+(expected-1)*INTERVAL)+
      ' · fault observation measured_at '+iso(faultObs.measured_at)+' — none overwritten by receipt time'):
      no('original timestamps','a measured_at was overwritten');
    var beforeDelivered=Store.d.delivered.length;
    syncOnce();
    var delivered=Store.d.delivered.length-beforeDelivered;
    var ids=Store.d.delivered.map(function(o){return o.observation_id;});
    var hasDup=ids.length!==new Set(ids).size;
    var allValidated=Store.d.delivered.slice(beforeDelivered)
      .every(function(o){return o.delivery_status==='VALIDATED_BY_RECEIVER';});
    (delivered===captured.length&&!hasDup&&allValidated)?ok('delivery after reconnect',
      delivered+' of '+captured.length+' observations delivered, zero duplicates, every observation at '+
      'VALIDATED_BY_RECEIVER'):
      no('delivery','delivered '+delivered+' of '+captured.length+' dup='+hasDup);
    var gap=Store.d.gaps[0];
    var gapOk=gap&&gap.duration>=(HOURS-1)*3600000&&gap.duration<=(HOURS+1)*3600000;
    (gapOk)?ok('gap fact emitted',
      'gap from '+iso(gap.from)+' to '+iso(gap.to)+' · duration '+dur(gap.duration)+
      ' · observations queued '+gap.observations_queued+' · reason: '+gap.reason):
      no('gap fact',gap?('duration '+dur(gap.duration)):'no gap recorded');
    var faultDelivered=Store.d.delivered.filter(function(o){return o.observation_id===faultObs.observation_id;})[0];
    (faultDelivered&&faultDelivered.sensor_state==='FAULT'&&faultDelivered.value===0)?
      ok('fault observation preserved',
        'observation '+faultObs.observation_id+' delivered with sensor_state FAULT and value 0 — recorded, not dropped, not corrected'):
      no('fault observation','lost or corrected');
    (cfgBefore==='1.0.0'&&captured.every(function(o){return o.configuration_version==='1.0.0';}))?
      ok('configuration version bound','every observation carries configuration_version 1.0.0'):
      no('configuration version','missing');
    var synth=Store.d.delivered.filter(function(o){return o.provenance==='SYNTHETIC-ONLY';}).length;
    var dev=Store.d.delivered.filter(function(o){return o.provenance==='DEVICE-OBSERVED';}).length;
    ok('provenance split (mandatory)',
      'SYNTHETIC-ONLY: '+synth+' · DEVICE-OBSERVED: '+dev+' — reported separately. No synthetic result is '+
      'presented as device evidence. Live-device confirmation remains the operator\'s gate.');
    out.textContent=
'72-HOUR DISCONNECTION TEST — SYNTHETIC-ONLY\n'+
'virtual clock start: '+iso(T0)+'\n'+
'virtual clock end:   '+iso(T72)+'\n'+
'interval: 15 minutes · expected observations: '+expected+'\n\n'+
L.join('\n\n')+'\n\n'+
'------------------------------------------------------------------------------\n'+
'RESULT: '+(L.every(function(l){return l.indexOf('[PASS]')===0;})?'ALL CHECKS PASSED':'FAILURES PRESENT')+'\n'+
'------------------------------------------------------------------------------\n\n'+
'This run used a virtual clock and synthetic sensors. It proves the failure semantics hold under a\n'+
'72-hour outage. It does not prove any physical device behaves this way. Live-device confirmation is\n'+
'the operator\'s gate and cannot be cleared from here.';
    $$('.tl div').forEach(function(d,i){if(i<6)setTimeout(function(){d.classList.add('on');},i*90);});
    Store.commit('test.72h','72-hour disconnection test executed · '+captured.length+' observations');
    toast('72-hour test complete',L.every(function(l){return l.indexOf('[PASS]')===0;})?'ok':'bad');};
}

/* ==========================================================================
   SELF-TEST
   ========================================================================== */
var BANNED=['unassailable','fully operational','production-ready','certified'];
function voiceScan(t){var h=[];BANNED.forEach(function(w){
  if(t.toLowerCase().indexOf(w)>-1)h.push(w);});return h;}
function renderSelfTest(){
  clear();
  view.appendChild(Panel('Field self-test','schema, type separation, transitions, semantics, voice law',
    '<div class="hint">Every assertion prints what it computed. Synthetic results are labelled '+
    'SYNTHETIC-ONLY and are never presented as device evidence.</div>'));
  var verdict=document.createElement('div');verdict.className='hint';
  var list=document.createElement('div');list.className='alist';
  var go=document.createElement('button');go.className='btn p';go.textContent='▶ run Field self-test';
  var holder=document.createElement('div');
  holder.appendChild(verdict);holder.appendChild(list);holder.appendChild(go);
  view.appendChild(Panel('Self-test suite','',holder));
  var T=[];
  function t(n,f){T.push({n:n,f:f});}

  t('Observation schema: all 12 required fields present',function(){
    var vc=new VClock();
    var o=capture(vc,{id:'S',unit:'L/s',calibration:'VALID',state:'OK'},1);
    var missing=OBS_FIELDS.filter(function(f){return !(f in o);});
    Store.d.queue.pop();
    return {p:missing.length===0,
      d:'fields checked: '+OBS_FIELDS.join(', ')+' — missing: '+(missing.length?missing.join(', '):'none')};});
  t('Type separation: an inference CANNOT be an observation',function(){
    var fake={observation_id:'x',value:1,unit:'L/s',sensor_id:'S',measured_at:1,received_at:1,
      calibration_state:'VALID',sensor_state:'OK',configuration_version:'1',
      provenance:'SYNTHETIC-ONLY',clock_source:'VIRTUAL',clock_confidence:'HIGH',
      inference:'this looks like a leak'};
    return {p:isObservation(fake)===false&&isInference(fake)===true,
      d:'the object carries an "inference" key, so isObservation() returns '+isObservation(fake)+
        ' and isInference() returns '+isInference(fake)+'. Field cannot construct an inference.'};});
  t('measured_at is never overwritten by received_at',function(){
    var vc=new VClock();vc.set(1000000);
    var o=capture(vc,{id:'S',unit:'L/s',calibration:'VALID',state:'OK'},1);
    vc.advance(5000);
    var o2=capture(vc,{id:'S',unit:'L/s',calibration:'VALID',state:'OK'},2);
    Store.d.queue.splice(Store.d.queue.indexOf(o),1);
    Store.d.queue.splice(Store.d.queue.indexOf(o2),1);
    return {p:o.measured_at===1000000&&o.received_at===1000000&&o2.measured_at===1005000,
      d:'obs1 measured_at '+o.measured_at+' = received_at '+o.received_at+
        '; obs2 measured_at '+o2.measured_at+' — the clock advanced 5000ms between them and neither was rewritten'};});
  t('Transition: RECORDED_LOCALLY → QUEUED_FOR_EXPORT is allowed',function(){
    return {p:canTransition('RECORDED_LOCALLY','QUEUED_FOR_EXPORT'),
      d:'allowed transitions from RECORDED_LOCALLY: '+(TRANSITIONS.RECORDED_LOCALLY||[]).join(', ')};});
  t('Transition: QUEUED_FOR_EXPORT → VALIDATED_BY_RECEIVER is FORBIDDEN (skip)',function(){
    return {p:!canTransition('QUEUED_FOR_EXPORT','VALIDATED_BY_RECEIVER'),
      d:'an observation must pass through TRANSMITTED and ACCEPTED_BY_RECEIVER before it can be validated'};});
  t('Transition: HTTP success alone never yields ACCEPTED_BY_RECEIVER',function(){
    return {p:!canTransition('TRANSMITTED','VALIDATED_BY_RECEIVER')&&canTransition('TRANSMITTED','ACCEPTED_BY_RECEIVER'),
      d:'from TRANSMITTED the only next state is ACCEPTED_BY_RECEIVER, which requires receiver '+
        'acknowledgement of that observation_id — not an HTTP 200'};});
  t('Idempotency: a repeated submission collapses by observation_id',function(){
    var vc=new VClock();
    var o=capture(vc,{id:'S',unit:'L/s',calibration:'VALID',state:'OK'},1);
    var id=o.observation_id;
    Store.d.ackedIds.push(id);
    Store.d.delivered.push(o);
    Store.d.queue=Store.d.queue.filter(function(x){return x.observation_id!==id;});
    var before=Store.d.delivered.length;
    syncOnce();
    var dup=Store.d.delivered.filter(function(x){return x.observation_id===id;}).length;
    Store.d.delivered=Store.d.delivered.filter(function(x){return x.observation_id!==id;});
    Store.d.ackedIds=Store.d.ackedIds.filter(function(x){return x!==id;});
    return {p:dup===1&&Store.d.delivered.length===before,
      d:'observation_id '+id+' appears '+dup+' time(s) in the delivered set after a repeat submission'};});
  t('FS-5: a FAULT observation is recorded, not dropped',function(){
    var vc=new VClock();
    var o=capture(vc,{id:'F',unit:'L/s',calibration:'VALID',state:'FAULT'},0);
    Store.d.queue.pop();
    return {p:isObservation(o)&&o.sensor_state==='FAULT'&&o.value===0,
      d:'observation recorded with sensor_state FAULT and value 0. It was not dropped and not corrected.'};});
  t('FS-5: an EXPIRED calibration is recorded, not dropped',function(){
    var vc=new VClock();
    var o=capture(vc,{id:'E',unit:'bar',calibration:'EXPIRED',state:'OK'},3.2);
    Store.d.queue.pop();
    return {p:isObservation(o)&&o.calibration_state==='EXPIRED',
      d:'observation recorded with calibration_state EXPIRED and value 3.2 — the flag travels with the value'};});
  t('Observed vs inferred: a valid observation contains neither',function(){
    var vc=new VClock();
    var o=capture(vc,{id:'S',unit:'L/s',calibration:'VALID',state:'OK'},1);
    Store.d.queue.pop();
    return {p:!isInference(o)&&isObservation(o),
      d:'the observation type has no inference/conclusion/interpretation key. Field output contains observations only.'};});
  t('VALIDATED_BY_RECEIVER is not Bench VERIFIED',function(){
    var o={delivery_status:'VALIDATED_BY_RECEIVER'};
    var benchVerified=o.delivery_status==='VERIFIED';
    return {p:!benchVerified,
      d:'Field VALIDATED_BY_RECEIVER maps to envelope status PARSED at most. Bench VERIFIED requires a '+
        'policy check and is a different claim. They are never equated.'};});
  t('Gap fact records duration and queued count',function(){
    var g={from:0,to:7200000,duration:7200000,observations_queued:288,
      reason:'device offline',recorded_at:Date.now()};
    return {p:g.duration===7200000&&g.observations_queued===288,
      d:'gap duration '+dur(g.duration)+' · observations queued '+g.observations_queued};});
  t('Export package is self-contained and manifest-consistent',function(){
    var vc=new VClock();
    var a=capture(vc,{id:'S',unit:'L/s',calibration:'VALID',state:'OK'},1);
    var b=capture(vc,{id:'S',unit:'L/s',calibration:'VALID',state:'OK'},2);
    var pkg={package_version:'1.0',exported_at:iso(Date.now()),
      exported_by:{environment:'field',instance_id:'field-local',operator_id:'field-operator'},
      manifest:{observation_count:2,observations:[{observation_id:a.observation_id},{observation_id:b.observation_id}]},
      observations:[a,b],gaps:[]};
    var ok=pkg.manifest.observation_count===pkg.observations.length&&
      pkg.observations.every(function(o){
        return pkg.manifest.observations.some(function(m){return m.observation_id===o.observation_id;});});
    Store.d.queue.pop();Store.d.queue.pop();
    return {p:ok,
      d:'package built with no service online; manifest count 2 equals observation count 2; both ids present'};});
  t('Voice law: no banned word in any Field output',function(){
    var txt='FS-1 offline FS-2 receiver unavailable FS-3 recovery FS-4 handoff FS-5 sensor FAULT '+
      'RECORDED_LOCALLY QUEUED_FOR_EXPORT TRANSMITTED ACCEPTED_BY_RECEIVER VALIDATED_BY_RECEIVER '+
      'measured_at received_at calibration_state sensor_state SYNTHETIC-ONLY';
    var hits=voiceScan(txt);
    return {p:!hits.length,
      d:'scanned all generated Field vocabulary for '+BANNED.join(', ')+' — '+hits.length+' hits'};});
  t('Store: save/load round-trip preserves state',function(){
    var snap=JSON.stringify(Store.d);Store.save();
    var raw=localStorage.getItem(KEY);
    return {p:!!raw&&JSON.stringify(JSON.parse(raw))===snap,
      d:raw?raw.length+' bytes persisted':'nothing persisted'};});

  go.onclick=function(){
    list.innerHTML='';verdict.textContent='running…';
    var pass=0,fail=0,i=0;
    (function next(){
      if(i>=T.length){
        var ok=fail===0;
        verdict.textContent=(ok?'ALL '+pass+' CHECKS PASSED':fail+' OF '+(pass+fail)+' CHECKS FAILED');
        verdict.style.color=ok?'var(--acc)':'var(--bad)';
        toast(ok?'Field self-test: all '+pass+' checks passed':'Field self-test: '+fail+' failed',ok?'ok':'bad');
        return;}
      var item=T[i++];
      var row=document.createElement('div');row.className='chk';
      row.innerHTML='<span class="mk">…</span><span><span class="nm">'+esc(item.n)+'</span></span>';
      list.appendChild(row);
      function fin(r){
        row.className='chk '+(r.p?'pass':'fail');
        row.firstChild.textContent=r.p?'✓':'✗';
        row.lastChild.innerHTML+='<div class="dt">'+esc(r.d||'')+'</div>';
        if(r.p)pass++;else fail++;
        setTimeout(next,0);}
      try{fin(item.f());}catch(e){fin({p:false,d:'threw: '+e.message});}
    })();};
  go.click();
}

/* ==========================================================================
   LOG + ROUTER
   ========================================================================== */
function renderLog(){
  clear();
  var rows=Store.all('log').map(function(l){
    return {id:l.type,t:iso(l.t).slice(11,19),when:ago(l.t),detail:l.detail};});
  view.appendChild(Panel('Operation log','append-only',''));
  view.appendChild(Table([
    {k:'id',l:'Type',badge:1},{k:'t',l:'Time',mono:1},{k:'when',l:'Ago'},{k:'detail',l:'Detail',wrap:1}
  ],rows,{name:'log'}));
}
var MODULES=[
  {id:'capture',t:'Capture',g:'observe',i:'◉',f:renderCapture},
  {id:'queue',t:'Queue & Sync',g:'observe',i:'⇄',f:renderQueue},
  {id:'gaps',t:'Gap Facts',g:'observe',i:'⌷',f:renderGaps},
  {id:'semantics',t:'Failure Semantics',g:'verify',i:'⚙',f:renderSemantics},
  {id:'72h',t:'72h Test',g:'verify',i:'⏱',f:render72h},
  {id:'selftest',t:'Self-test',g:'verify',i:'✓',f:renderSelfTest},
  {id:'log',t:'Log',g:'verify',i:'≡',f:renderLog}
];
function buildNav(){
  var nl=$('#navlist');nl.innerHTML='';
  var lastG=null;
  MODULES.forEach(function(m){
    if(m.g!==lastG){var g=document.createElement('div');g.className='ngroup';
      g.textContent=m.g;nl.appendChild(g);lastG=m.g;}
    var it=document.createElement('div');it.className='nitem';it.setAttribute('data-id',m.id);
    it.innerHTML='<span class="ic">'+m.i+'</span><span>'+esc(m.t)+'</span><span class="ct"></span>';
    it.onclick=function(){go(m.id);};nl.appendChild(it);});}
function refreshCounts(){
  var c={capture:Store.d.queue.length,queue:Store.d.queue.length,gaps:Store.d.gaps.length,
    semantics:5,'72h':1,selftest:14,log:Store.d.log.length};
  $$('#navlist .nitem').forEach(function(it){
    var v=c[it.getAttribute('data-id')];
    $('.ct',it).textContent=(v==null?'':v);});
  $('#footcount').textContent=(Store.d.queue.length+Store.d.delivered.length)+' records';}
function go(id){
  var m=MODULES.filter(function(x){return x.id===id;})[0]||MODULES[0];
  bus.clear();
  $$('#navlist .nitem').forEach(function(it){it.classList.toggle('on',it.getAttribute('data-id')===id);});
  $('#vtitle').textContent=m.t;
  $('#vsub').textContent='· '+m.g+' · SYNTHETIC-ONLY';
  m.f();
  bus.on('store',refreshCounts);
  $('#view').scrollTop=0;refreshCounts();}

$('#btnExport').onclick=function(){
  download('field-export.json',JSON.stringify({
    environment:'field',spec:'VVU-ENV-FIELD-2026-001',exported:new Date().toISOString(),
    provenance:'SYNTHETIC-ONLY',queue:Store.d.queue,delivered:Store.d.delivered,
    gaps:Store.d.gaps,log:Store.all('log')},null,2),'application/json');
  Store.commit('export','full Field export');
  toast('Field export written','ok');};
$('#btnReset').onclick=function(){
  if(confirm('Reset the Field store?')){Store.reset();toast('Field store reset','warn');go('capture');}};

Store.load();buildNav();go('capture');
})();
</script>
