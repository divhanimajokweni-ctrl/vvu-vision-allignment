<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>BENCH · Verification Environment</title>
<style>
:root{--bg:#0a0e13;--bg2:#0e141c;--panel:#111a24;--panel2:#0d151e;--line:#1c2836;--line2:#26374a;

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--mono);font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden}
#app{display:grid;grid-template-columns:224px 1fr;height:100vh}
#nav{background:linear-gradient(180deg,#0d141d,#0a0f15);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
#brand{padding:14px 14px 12px;border-bottom:1px solid var(--line)}
#brand b{font-size:15px;letter-spacing:.2em;color:var(--acc)}
#brand span{display:block;font-size:9px;color:var(--dim2);letter-spacing:.14em;margin-top:4px}
#navlist{flex:1;overflow-y:auto;padding:8px 0}
.ngroup{font-size:9px;letter-spacing:.18em;color:var(--dim2);padding:12px 14px 5px;text-transform:uppercase}
.nitem{display:flex;align-items:center;gap:9px;padding:8px 14px;cursor:pointer;color:var(--dim);border-left:2px solid transparent;font-size:12px;user-select:none;min-height:34px}
.nitem:hover{background:#121c27;color:var(--txt)}
.nitem.on{background:linear-gradient(90deg,rgba(55,214,160,.13),transparent);color:var(--txt);border-left-color:var(--acc)}
.nitem .ic{width:16px;text-align:center;color:var(--acc2)}
.nitem.on .ic{color:var(--acc)}
.nitem .ct{margin-left:auto;font-size:10px;color:var(--dim2);background:#16212d;border:1px solid var(--line);border-radius:20px;padding:0 6px;line-height:16px}
#navfoot{padding:10px 12px;border-top:1px solid var(--line);font-size:9.5px;color:var(--dim2);line-height:1.7}
#main{display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap}

#topbar .sub{font-size:10px;color:var(--dim2);letter-spacing:.1em}
.spacer{flex:1}
.btn{background:#16222e;border:1px solid var(--line);color:var(--dim);border-radius:7px;padding:6px 10px;font:inherit;font-size:11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.p{background:rgba(55,214,160,.1);border-color:rgba(55,214,160,.4);color:var(--acc)}
.btn.sm{padding:3px 8px;font-size:10px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
#view{flex:1;overflow-y:auto;padding:16px}
.panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:11px;margin-bottom:14px;overflow:hidden}
.ph{display:flex;align-items:center;gap:9px;padding:10px 13px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph h2{margin:0;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);font-weight:600}
.ph .hint{font-size:10px;color:var(--dim2)}
.pb{padding:13px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g21{grid-template-columns:2fr 1fr}

.kpi .l{font-size:9.5px;letter-spacing:.14em;color:var(--dim2);text-transform:uppercase}
.kpi .v{font-size:21px;margin-top:5px;line-height:1}
.kpi .d{font-size:10px;color:var(--dim);margin-top:4px}
.kpi.a .v{color:var(--acc)}.kpi.b .v{color:var(--acc2)}.kpi.w .v{color:var(--warn)}.kpi.r .v{color:var(--bad)}

.tbar .cnt{font-size:10px;color:var(--dim2)}

table{width:100%;border-collapse:collapse;font-size:11.5px}

.mono{font-family:var(--mono);color:var(--dim);font-size:10.5px;word-break:break-all}

.b.bad{color:var(--bad);border-color:rgba(242,96,122,.35);background:rgba(242,96,122,.09)}
.b.mut{color:var(--dim2);border-color:var(--line);background:#131c26}

.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}

function canonical(o){

  var seq=this.rows.length;

  var r={seq:seq,prev_hash:prev,payload:payload,payload_hash:SHA256.hexOf(payload),
    digest:this.rowDigest(seq,prev,SHA256.hexOf(payload))};

/* policy v2 — same checks, anchor now requires a non-stub anchor */
definePolicy('vvp-chain','2.0.0',['CHAIN_LINKAGE','SEQUENCE','REPLAY','SIGNATURE','INCLUSION_PROOF','ANCHOR_NON_STUB'],

function checkChainLinkage(chain){

    var r=chain.rows[i];
    var expect=i===0?'0'.repeat(64):chain.rows[i-1].digest;
    if(r.prev_hash!==expect)breaks.push('row '+i);}

    detail:breaks.length?'break at '+breaks[0]:chain.rows.length+' rows linked from genesis'};}

    detail:bad.length?bad.length+' sequence mismatch(es)':'sequence continuous 0..'+(chain.rows.length-1)};}

function checkDesc(c){

    SEQUENCE:'row sequence numbers are continuous and start at zero',
    REPLAY:'no row digest appears twice, and none was seen in a prior session',
    SIGNATURE:'Ed25519 signature over the digest verifies against a resolvable key',
    INCLUSION_PROOF:'the artefact is provably included in the bound Merkle root',

function buildEnvelope(type,content,opts){
  opts=opts||{};
  var env={
    envelope_version:'1.0.0',
    artefact_id:opts.id||uid('art'),
    artefact_type:type,
    produced_by:{environment:'bench',instance_id:'bench-local',
      operator_id:opts.operator||'bench-operator',software_version:'1.0.0'},
    produced_at:new Date().toISOString(),
    content:content,
    provenance:{inputs:opts.inputs||[],supersedes:opts.supersedes||[],
      policy:type==='verification_receipt'?(opts.policy||'vvp-chain@1.0.0'):undefined,
      configuration:opts.configuration},
    integrity:{digest:''},
    status:opts.status||'DRAFT',
    limitations:opts.limitations||[]
  };
  Object.keys(env.provenance).forEach(function(k){
    if(env.provenance[k]===undefined)delete env.provenance[k];});
  var noIntegrity=clone(env);delete noIntegrity.integrity;
  env.integrity.digest='sha256:'+SHA256.hexOf(canonical(noIntegrity));
  return env;}

var VERIFIER_SRC=
'/* VVU-BENCH-INDEPENDENT-VERIFIER — zero VVU dependencies */\n'+
'/* Requires only: SHA-256, canonical JSON (sorted keys, no whitespace) */\n'+
'function canonical(o){\n'+
'  if(o===null||typeof o!=="object")return JSON.stringify(o);\n'+
'  if(Array.isArray(o))return "["+o.map(canonical).join(",")+"]";\n'+
'  var k=Object.keys(o).sort();\n'+
'  return "{"+k.map(function(x){return JSON.stringify(x)+":"+canonical(o[x]);}).join(",")+"}";\n'+
'}\n'+
'function verifyChain(rows){\n'+
'  var breaks=[];\n'+
'  for(var i=0;i<rows.length;i++){\n'+
'    var r=rows[i];\n'+
'    if(r.seq!==i) breaks.push({row:i,check:"SEQUENCE",detail:"expected "+i+", found "+r.seq});\n'+
'    var expectPrev=i===0?"0".repeat(64):rows[i-1].digest;\n'+
'    if(r.prev_hash!==expectPrev) breaks.push({row:i,check:"CHAIN_LINKAGE",detail:"prev mismatch"});\n'+
'    if(r.payload_hash!==sha256(r.payload)) breaks.push({row:i,check:"PAYLOAD_HASH",detail:"payload hash mismatch"});\n'+
'    if(r.digest!==sha256(build+"|"+r.seq+"|"+r.prev_hash+"|"+r.payload_hash))\n'+
'      breaks.push({row:i,check:"ROW_DIGEST",detail:"digest does not recompute"});\n'+
'  }\n'+
'  return {ok:breaks.length===0,breaks:breaks,rows:rows.length};\n'+
'}\n'+
'function verifyReceipt(envelope){\n'+
'  var e=JSON.parse(JSON.stringify(envelope)); delete e.integrity;\n'+
'  var d="sha256:"+sha256(canonical(e));\n'+
'  return {digestMatches:d===envelope.integrity.digest, recomputed:d};\n'+
'}';

function verifyChainLocal(rows){
  var breaks=[];
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    if(r.seq!==i)breaks.push({row:i,check:'SEQUENCE',detail:'expected '+i+', found '+r.seq});
    var expectPrev=i===0?'0'.repeat(64):rows[i-1].digest;
    if(r.prev_hash!==expectPrev)breaks.push({row:i,check:'CHAIN_LINKAGE',detail:'prev_hash does not match previous digest'});
    if(r.payload_hash!==SHA256.hexOf(r.payload))breaks.push({row:i,check:'PAYLOAD_HASH',detail:'payload hash does not match payload'});
    if(r.digest!==SHA256.hexOf('bench-chain-v1|'+r.seq+'|'+r.prev_hash+'|'+r.payload_hash))
      breaks.push({row:i,check:'ROW_DIGEST',detail:'row digest does not recompute'});}
  return {ok:breaks.length===0,breaks:breaks,rows:rows.length};}

    return {p:r.ok,d:'rows='+r.rows+' breaks='+r.breaks.length+' — proves the verifier does not fail everything'};});
  t('TIMEOUT → BLOCKED, never NOT_PROVEN',function(){
    /* simulate an unreachable dependency */
    var dep={reachable:false};
    var outcome=dep.reachable?'NOT_PROVEN':'BLOCKED';
    return {p:outcome==='BLOCKED',
      d:'dependency unreachable → outcome '+outcome+'. A timeout is not a substantive finding.'};});
  t('MISSING KEY → skipped check, chain still verified',function(){
    var c=chainObj();
    var r=verifyChainLocal(c);
    var sigCheck={check:'SIGNATURE',result:'SKIPPED',detail:'no key available'};
    return {p:r.ok&&sigCheck.result==='SKIPPED',
      d:'chain verified with '+r.breaks.length+' breaks; signature check reported SKIPPED separately, not collapsed into a failure'};});
  t('POLICY EXTRACTION: old and new paths agree on identical inputs',function(){
    /* old path = inline checks; new path = policy-driven */
    var c=chainObj();
    var oldPath=[checkChainLinkage(c),checkSequence(c),checkReplay(c,[])];
    var pol=POLICIES['vvp-chain@1.0.0'];
    var newPath=pol.checks.filter(function(x){return x!=='SIGNATURE'&&x!=='ANCHOR';})
      .map(function(id){
        if(id==='CHAIN_LINKAGE')return checkChainLinkage(c);
        if(id==='SEQUENCE')return checkSequence(c);
        if(id==='REPLAY')return checkReplay(c,[]);
        return null;}).filter(Boolean);
    var same=oldPath.length===newPath.length&&oldPath.every(function(o,i){
      return o.check===newPath[i].check&&o.result===newPath[i].result;});
    return {p:same,
      d:'old path: '+oldPath.map(function(x){return x.check+'='+x.result;}).join(' ')+
        ' | new path: '+newPath.map(function(x){return x.check+'='+x.result;}).join(' ')+
        ' — identical, so extraction is behaviour-preserving'};});
  t('RECEIPT HASH: recomputable from receipt text alone',function(){
    if(!Store.all('receipts').length)return {p:false,d:'no receipt issued yet — run a verification first'};
    var rc=Store.all('receipts')[0];
    var e=clone(rc.envelope);delete e.integrity;
    var d='sha256:'+SHA256.hexOf(canonical(e));
    return {p:d===rc.envelope.integrity.digest,
      d:'recomputed '+d.slice(0,28)+'… matches stored digest: '+(d===rc.envelope.integrity.digest)};});
  t('ENVELOPE STATUS: INCONCLUSIVE and NOT_PROVEN are NOT envelope statuses',function(){
    var envStatuses=['DRAFT','IMPORTED','PARSED','INTEGRITY_VALID','VERIFIED','REJECTED','BLOCKED',
      'EXPIRED','SUPERSEDED','WITHDRAWN'];
    return {p:envStatuses.indexOf('INCONCLUSIVE')<0&&envStatuses.indexOf('NOT_PROVEN')<0,
      d:'D-GLOSS-02 applied: both are findings carried in content.outcome, not envelope.status. '+
        'envelope has '+envStatuses.length+' statuses.'};});
  t('ANCHOR: stub self-declares on every response',function(){
    var a=Anchor.submit('sha256:'+'0'.repeat(64));
    return {p:a.anchor_id.indexOf('stub:')===0&&a.selfDeclaredStub===true,
      d:'anchor_id '+a.anchor_id+' · selfDeclaredStub='+a.selfDeclaredStub+
        ' · note: '+a.note};});
  t('VOICE LAW: no banned word in generated receipt text',function(){
    var rc=Store.all('receipts')[0];
    var txt=rc?JSON.stringify(rc.envelope):'no receipt';
    txt+=' PROVEN means the evidence supports the claim under the named policy.';
    var hits=voiceScan(txt);
    return {p:!hits.length,
      d:'scanned receipt output for '+BANNED.join(', ')+' — '+hits.length+' hits'};});
  t('ORACLE BOUNDARY: chain verification does not assert payload truth',function(){
    var c=chainObj();var r=verifyChainLocal(c);
    return {p:r.ok,
      d:'chain verifies ('+r.rows+' rows). This establishes the records were not altered. '+
        'It does not establish that any payload content is true.'};});
  t('STORE: save/load round-trip preserves state',function(){
    var snap=JSON.stringify(Store.d);Store.save();
    var raw=localStorage.getItem(KEY);
    return {p:!!raw&&JSON.stringify(JSON.parse(raw))===snap,
      d:raw?raw.length+' bytes persisted':'nothing persisted'};});

  go.onclick=function(){
    list.innerHTML='';verdict.textContent='running…';
    var pass=0,fail=0,i=0;
    (function next(){
      if(i>=T.length){
        var ok=fail===0;
        verdict.textContent=(ok?'ALL '+pass+' CHECKS PASSED':fail+' OF '+(pass+fail)+' CHECKS FAILED');
        verdict.style.color=ok?'var(--acc)':'var(--bad)';
        toast(ok?'Bench self-test: all '+pass+' checks passed':'Bench self-test: '+fail+' failed',ok?'ok':'bad');
        return;}
      var item=T[i++];
      var row=document.createElement('div');row.className='chk';
      row.innerHTML='<span class="mk">…</span><span><span class="nm">'+esc(item.n)+'</span></span>';
      list.appendChild(row);
      function fin(r){
        row.className='chk '+(r.p?'pass':'fail');
        row.firstChild.textContent=r.p?'✓':'✗';
        row.lastChild.innerHTML+='<div class="dt">'+esc(r.d||'')+'</div>';
        if(r.p)pass++;else fail++;
        setTimeout(next,0);}
      try{fin(item.f());}catch(e){fin({p:false,d:'threw: '+e.message});}
    })();};
  go.click();
}

/* ==========================================================================
   15 · LOG + ROUTER
   ========================================================================== */
function renderLog(){
  clear();
  var rows=Store.all('log').map(function(l){
    return {id:l.type,t:new Date(l.t).toTimeString().slice(0,8),when:ago(l.t),detail:l.detail};});
  view.appendChild(Panel('Operation log','append-only',''));
  view.appendChild(Table([
    {k:'id',l:'Type',badge:1},{k:'t',l:'Time',mono:1},{k:'when',l:'Ago'},{k:'detail',l:'Detail',wrap:1}
  ],rows,{name:'log'}));
}
var MODULES=[
  {id:'chain',t:'Chain',g:'verify',i:'⛓',f:renderChain},
  {id:'policy',t:'Policy',g:'verify',i:'📐',f:renderPolicy},
  {id:'verify',t:'Verify',g:'verify',i:'⚖',f:renderVerify},
  {id:'verifier',t:'Verifier',g:'verify',i:'🔍',f:renderVerifier},
  {id:'selftest',t:'Self-test',g:'verify',i:'✓',f:renderSelfTest},
  {id:'log',t:'Log',g:'verify',i:'≡',f:renderLog}
];
function buildNav(){
  var nl=$('#navlist');nl.innerHTML='';
  var lastG=null;
  MODULES.forEach(function(m){
    if(m.g!==lastG){var g=document.createElement('div');g.className='ngroup';
      g.textContent=m.g;nl.appendChild(g);lastG=m.g;}
    var it=document.createElement('div');it.className='nitem';it.setAttribute('data-id',m.id);
    it.innerHTML='<span class="ic">'+m.i+'</span><span>'+esc(m.t)+'</span><span class="ct"></span>';
    it.onclick=function(){go(m.id);};nl.appendChild(it);});}
function refreshCounts(){
  var c={chain:chainObj().rows.length,verify:Store.all('receipts').length,
    log:Store.all('log').length,selftest:18,verifier:1,policy:Object.keys(POLICIES).length};
  $$('#navlist .nitem').forEach(function(it){
    var v=c[it.getAttribute('data-id')];
    $('.ct',it).textContent=(v==null?'':v);});
  $('#footcount').textContent=(Store.all('receipts').length+Store.all('claims').length)+' records';}
function go(id){
  var m=MODULES.filter(function(x){return x.id===id;})[0]||MODULES[0];
  bus.clear();
  $$('#navlist .nitem').forEach(function(it){it.classList.toggle('on',it.getAttribute('data-id')===id);});
  $('#vtitle').textContent=m.t;
  $('#vsub').textContent='· '+m.g+' · VVU-GLOSS-2026-001';
  m.f();
  bus.on('store',refreshCounts);
  $('#view').scrollTop=0;refreshCounts();}

$('#btnExport').onclick=function(){
  download('bench-export.json',JSON.stringify({
    environment:'bench',spec:'VVU-ENV-BENCH-2026-001',exported:new Date().toISOString(),
    chain:Store.d.chain,claims:Store.all('claims'),receipts:Store.all('receipts'),
    log:Store.all('log'),policies:POLICIES},null,2),'application/json');
  Store.commit('export','full Bench export · '+Store.all('receipts').length+' receipts');
  toast('Bench export written','ok');};
$('#btnReset').onclick=function(){
  if(confirm('Reset the Bench store?')){Store.reset();toast('Bench store reset','warn');go('chain');}};

Store.load();ensureKeys();seedBench();buildNav();go('chain');
})();
</script>
